};
const STATES = ['ACT','NSW','NT','QLD','SA','TAS','VIC','WA'];
const ERAS = ['pioneer (pre-1970)','boom (1970s–early 80s)','late century (1985–1999)','revival (2000s–2014)','modern (2015+)','unknown'];
const STATUS_LABEL = { standing:'Still standing', replaced:'Rebuilt or replaced', relocated:'Moved', removed:'Gone from its spot', demolished:'Demolished' };
const cat = (c) => CATS[c] || CATS.oddity;
const isGone = (t) => t.status === 'demolished' || t.status === 'removed';
const isFuzzy = (t) => t.precision === 'town';

/* ---------------- state ---------------- */
const F = {
  q:'', states:new Set(), cats:new Set(), eras:new Set(),
  hideGone:false, exactOnly:false,
};
let trip = [];
let selected = null;

/**
 * Direct links: #thing=<id> opens one card, #state=NSW or #state=NSW,QLD
 * pre-applies the state filter. Read once at load — nothing here listens for
 * hashchange, since every in-app navigation already updates F/selected
 * directly and syncHash() keeps the address bar in step with it.
 */
const initialHash = new URLSearchParams(location.hash.slice(1));
const hashThing = initialHash.get('thing');
const hashStates = (initialHash.get('state') || '').split(',').map((s) => s.trim().toUpperCase()).filter(Boolean);

/* ---------------- map ---------------- */
const PHONE = window.matchMedia('(max-width:860px)').matches;
/** Continental Australia, incl. Tasmania — the frame every view starts from. */
const AU_VIEW = L.latLngBounds([[-44.2, 112.0], [-9.5, 154.5]]);
const map = L.map('map', {
  zoomControl:false, minZoom:2.5, maxZoom:19,
  // Fractional zoom lets fitBounds actually fill a narrow phone viewport
  // instead of snapping down a whole level and stranding Australia in ocean.
  zoomSnap:0.25, zoomDelta:0.5,
  worldCopyJump:false, attributionControl:false,
}).fitBounds(AU_VIEW, { padding:[4, 4] });
// A backgrounded tab can defer requestAnimationFrame far longer than one
// frame — long enough for a direct link, a search or a filter to have
// already moved the map for a real reason by the time this fires. Without
// tracking that, the "re-frame once the grid has settled" correction below
// would silently stomp back to the continent view over whatever the user (or
// a direct link) had already navigated to.
let mapMovedSinceInit = false;
map.on('zoomend moveend', () => { mapMovedSinceInit = true; });
// Re-frame once the grid has settled, and whenever the viewport changes shape
// — unless the view already moved for a real reason in the meantime.
requestAnimationFrame(() => {
  const alreadyMoved = mapMovedSinceInit;
  map.invalidateSize();
  if (!alreadyMoved) map.fitBounds(AU_VIEW, { padding:[4, 4] });
});
if (!PHONE) L.control.zoom({ position:'bottomright' }).addTo(map);
const attribution = L.control.attribution({ position:'bottomright', prefix:false }).addTo(map);

/**
 * Place-name labels are opt-in (see the "Show place names" switch) and, even
 * then, only past a zoom worth reading one at — at the continent view every
 * one of 477 towns overlapping is worse than the map they're meant to help.
 */
const LABEL_ZOOM = 8;
const mapEl = document.getElementById('map');
const syncLabelZoom = () => mapEl.classList.toggle('labels-zoom', map.getZoom() >= LABEL_ZOOM);
map.on('zoomend', syncLabelZoom);
syncLabelZoom();

/**
 * Basemap: a vector coastline at the continent view, real OpenStreetMap
 * tiles once you're zoomed in far enough for streets and town names to
 * matter. Loading tile-server imagery for the whole of Australia at once is
 * wasteful and, at that scale, looks worse than the app's own coastline —
 * the swap is a legibility choice, not a network workaround, so it stays
 * regardless of where this is hosted.
 */
attribution.addAttribution('Coastline © <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener noreferrer">Natural Earth</a> (public domain)');
attribution.addAttribution('Map tiles © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors');
const TILE_ZOOM = 7;
const outlineLayer = OUTLINE ? L.geoJSON(OUTLINE, {
  interactive:false,
  style:{ color:'#8d8472', weight:1.25, fillColor:'#efe6d2', fillOpacity:1 },
}) : null;
const tileLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, crossOrigin:true });
function syncBasemap() {
  if (map.getZoom() >= TILE_ZOOM) {
    if (!map.hasLayer(tileLayer)) tileLayer.addTo(map);
    if (outlineLayer && map.hasLayer(outlineLayer)) map.removeLayer(outlineLayer);
  } else {
    if (outlineLayer && !map.hasLayer(outlineLayer)) outlineLayer.addTo(map);
    if (map.hasLayer(tileLayer)) map.removeLayer(tileLayer);
  }
}
map.on('zoomend', syncBasemap);
syncBasemap();

const tripLine = L.polyline([], { color:'#2f7d52', weight:4, opacity:.85, dashArray:'1 9', lineCap:'round' }).addTo(map);
const tripMarkers = L.layerGroup().addTo(map);

const cluster = L.markerClusterGroup({
  maxClusterRadius:(z) => (z < 6 ? 62 : z < 9 ? 44 : 26),
  spiderfyOnMaxZoom:true, showCoverageOnHover:false, disableClusteringAtZoom:14,
  iconCreateFunction(c) {
    const n = c.getChildCount();
    const s = n < 10 ? 36 : n < 50 ? 44 : 52;
    return L.divIcon({
      html:`<div class="clus" style="width:${s}px;height:${s}px;font-size:${n<100?15:13}px">${n}</div>`,
      className:'', iconSize:[s,s],
    });
  },
});
map.addLayer(cluster);

function iconFor(t) {
  const c = cat(t.category);
  const cls = ['pin', isFuzzy(t) ? 'fuzzy' : '', isGone(t) ? 'gone' : '', selected === t.id ? 'sel' : ''].filter(Boolean).join(' ');
  return L.divIcon({
    html:`<div class="${cls}" style="background:${c.colour}"><span>${c.emoji}</span></div>`,
    className:'', iconSize:[34,34], iconAnchor:[17,32], popupAnchor:[0,-30],
  });
}

/** Short place name for the on-map label — the town, not the full address. */
function placeLabel(t) {
  return t.town || String(t.location || '').split(',')[0].trim() || t.stateName;
}

/** Location line for the details panel: shows both Location and Town when they differ. */
function where(t) {
  const loc = String(t.location || '').trim();
  const town = String(t.town || '').trim();
  if (loc && town && !loc.toLowerCase().includes(town.toLowerCase())) return `${loc}, ${town}`;
  return loc || town;
}

const markers = new Map();
for (const t of THINGS) {
  if (t.lat == null) continue;
  const m = L.marker([t.lat, t.lng], { icon:iconFor(t), title:t.name, riseOnHover:true, keyboard:true });
  m.on('click', () => openDetail(t.id, false));
  m.bindTooltip(esc(placeLabel(t)), { permanent:true, direction:'top', offset:[0,-30], className:'pinlabel', interactive:false });
  markers.set(t.id, m);
}

/* ---------------- filtering ---------------- */
function matches(t) {
  if (F.states.size && !F.states.has(t.state)) return false;
  if (F.cats.size && !F.cats.has(t.category)) return false;
  if (F.eras.size && !F.eras.has(t.era)) return false;
  if (F.hideGone && isGone(t)) return false;
  if (F.exactOnly && isFuzzy(t)) return false;
  if (F.q) {
    const q = F.q.toLowerCase();
    const hay = [t.name, t.location, t.town, t.stateName, t.state, t.notes, t.blurb, cat(t.category).label]
      .filter(Boolean).join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

let visible = [];
function refresh(fit) {
  visible = THINGS.filter(matches);
  // Diff against what's currently on the map rather than clearLayers() +
  // addLayers(): Leaflet.markercluster's bulk addLayers() can silently fail
  // to populate the on-screen feature group after a clearLayers() reset —
  // reproducible by narrowing a search down to a small result set, which
  // left a real match with nothing shown for it on the map. addLayer() /
  // removeLayer(), called singly, don't have that bug.
  const wanted = new Set();
  let shown = 0;
  for (const t of visible) {
    const m = markers.get(t.id);
    if (!m) continue;
    wanted.add(t.id);
    m.setIcon(iconFor(t));
    if (!cluster.hasLayer(m)) cluster.addLayer(m);
    shown++;
  }
  for (const [id, m] of markers) {
    if (!wanted.has(id) && cluster.hasLayer(m)) cluster.removeLayer(m);
  }

  const note = [];
  note.push(`${shown} of ${THINGS.length} big things shown`);
  const fuzzy = visible.filter(isFuzzy).length;
  if (fuzzy) note.push(`${fuzzy} placed at town level`);
  document.getElementById('mapnote').textContent = note.join(' · ');

  document.querySelectorAll('.chip[data-kind]').forEach(renderChipCount);
  // Re-render the list (if open) before measuring anything below — its
  // height depends on its content, and the fit block needs the real,
  // up-to-date height, not whatever was on screen before this refresh.
  if (document.getElementById('listsheet').classList.contains('open')) renderList();
  if (fit && shown) {
    const b = L.latLngBounds(visible.filter((t) => t.lat != null).map((t) => [t.lat, t.lng]));
    // A bottom sheet (the results list, most often) can be sitting over the
    // lower part of the map at this exact moment — a single narrowed-down
    // result centred in the *full* map box then lands right underneath it,
    // looking exactly like the pin never appeared. Padding the fit by the
    // open sheet's actual height keeps the result above it instead.
    const openSheet = document.querySelector('.sheet.open');
    const sheetPad = openSheet ? openSheet.getBoundingClientRect().height + 16 : 16;
    if (b.isValid()) {
      map.fitBounds(b.pad(0.14), {
        animate:true, maxZoom:12,
        paddingTopLeft:[16, 16], paddingBottomRight:[16, sheetPad],
      });
    }
  }
  syncHash();
}

/**
 * Keep the address bar a shareable link to whatever's on screen: an open
 * card wins over a state filter, which wins over nothing. Uses
 * replaceState rather than location.hash so clicking around the map
 * doesn't fill up the back button with one entry per pin.
 */
function syncHash() {
  const base = location.pathname + location.search;
  if (selected) { history.replaceState(null, '', `${base}#thing=${selected}`); return; }
  if (F.states.size) { history.replaceState(null, '', `${base}#state=${[...F.states].join(',')}`); return; }
  if (location.hash) history.replaceState(null, '', base);
}

/* ---------------- chips ---------------- */
function chip(kind, value, label, extra) {
  const el = document.createElement('button');
  el.className = 'chip';
  el.dataset.kind = kind; el.dataset.value = value;
  el.setAttribute('aria-pressed','false');
  el.innerHTML = (extra && extra.dot ? `<span class="dot" style="background:${extra.dot}"></span>` : '')
    + (extra && extra.emoji ? extra.emoji + ' ' : '')
    + `<span>${label}</span><span class="n"></span>`;
  el.addEventListener('click', () => {
    const set = kind === 'state' ? F.states : kind === 'cat' ? F.cats : F.eras;
    if (set.has(value)) set.delete(value); else set.add(value);
    el.setAttribute('aria-pressed', set.has(value) ? 'true' : 'false');
    refresh(kind === 'state');
  });
  return el;
}
function renderChipCount(el) {
  const kind = el.dataset.kind, value = el.dataset.value;
  const probe = { ...F };
  const n = THINGS.filter((t) => {
    if (kind === 'state') return t.state === value && matchesExcept(t, 'states');
    if (kind === 'cat') return t.category === value && matchesExcept(t, 'cats');
    return t.era === value && matchesExcept(t, 'eras');
  }).length;
  el.querySelector('.n').textContent = n;
  el.style.opacity = n ? 1 : .38;
}
function matchesExcept(t, skip) {
  const saved = F[skip];
  F[skip] = new Set();
  const ok = matches(t);
  F[skip] = saved;
  return ok;
}

function buildFilters() {
  const wrap = document.getElementById('filters');
  const mk = (title, kind, values, extras, clearSet) => {
    const g = document.createElement('div'); g.className = 'fgroup';
    const l = document.createElement('p'); l.className = 'flabel';
    l.innerHTML = `<span>${title}</span>`;
    const clr = document.createElement('button'); clr.textContent = 'all';
    clr.addEventListener('click', () => {
      clearSet.clear();
      g.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed','false'));
      refresh(kind === 'state');
    });
    l.appendChild(clr); g.appendChild(l);
    const c = document.createElement('div'); c.className = 'chips';
    for (const v of values) c.appendChild(chip(kind, v, extras(v).label, extras(v)));
    g.appendChild(c); wrap.appendChild(g);
  };

  mk('State / territory', 'state', STATES, (s) => ({ label:s }), F.states);
  mk('What is it', 'cat', Object.keys(CATS), (c) => ({ label:CATS[c].label, emoji:CATS[c].emoji, dot:CATS[c].colour }), F.cats);
  mk('When it went up', 'era', ERAS, (e) => ({ label:e.replace(/ \(.*\)/,'') + (e === 'unknown' ? '' : ' · ' + (e.match(/\((.*)\)/)||[])[1]) }), F.eras);

  const dg = document.createElement('div'); dg.className = 'fgroup';
  dg.innerHTML = '<p class="flabel"><span>Map display</span></p>';
  const dlab = document.createElement('label'); dlab.className = 'switch';
  const dcb = document.createElement('input'); dcb.type = 'checkbox';
  dcb.addEventListener('change', () => mapEl.classList.toggle('labels-on', dcb.checked));
  dlab.appendChild(dcb); dlab.appendChild(document.createTextNode('🏷️ Show place names: appear once you zoom into an area'));
  dg.appendChild(dlab); wrap.appendChild(dg);

  const g = document.createElement('div'); g.className = 'fgroup';
  g.innerHTML = '<p class="flabel"><span>Honesty settings</span></p>';
  const opts = [
    ['hideGone','Hide the dead ones: demolished, removed, or gone from their spot'],
    ['exactOnly','Only pinpointed pins: hide the ones placed at their town’s centre'],
  ];
  for (const [key, text] of opts) {
    const lab = document.createElement('label'); lab.className = 'switch';
    const cb = document.createElement('input'); cb.type = 'checkbox';
    cb.addEventListener('change', () => { F[key] = cb.checked; refresh(false); });
    lab.appendChild(cb); lab.appendChild(document.createTextNode(text));
    g.appendChild(lab);
  }
  wrap.appendChild(g);
}

/* ---------------- detail ---------------- */
/**
 * Where to load a photo from — always the vendored local copy, showing
 * nothing rather than reaching out to Commons for one that isn't.
 */
function photoUrl(file) {
  const c = CREDITS[file];
  return c && c.f ? c.f : null;
}

/**
 * The photographer and licence for a photo.
 *
 * This is a licence obligation, not a courtesy: most of these files are CC BY
 * or CC BY-SA, which require naming the author and the licence. The app
 * displayed them bare for several versions, which was a breach.
 */
function photoCredit(file) {
  const c = CREDITS[file];
  if (!c) return '';
  const author = c.a ? esc(c.a.length > 70 ? c.a.slice(0, 70) + '…' : c.a) : 'Unknown';
  const authorHtml = c.p ? `<a href="${c.p}" target="_blank" rel="noopener noreferrer">${author}</a>` : author;
  const licence = c.l ? esc(c.l) : 'see file page';
  const licenceHtml = c.u ? `<a href="${c.u}" target="_blank" rel="noopener noreferrer">${licence}</a>` : licence;
  // A custom photo (see docs/ADMIN.md) never came from Commons — saying it did
  // would be exactly the kind of invented provenance this project exists to
  // avoid. If you gave it its own source URL, name that site instead; if you
  // didn't, there's nowhere honest to send "via" to, so the clause is dropped.
  let via = '';
  if (!file.startsWith('custom:')) {
    via = ` · via <a href="${c.p || 'https://commons.wikimedia.org/'}" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>`;
  } else if (c.p) {
    let host = 'source';
    try { host = new URL(c.p).hostname.replace(/^www\./, ''); } catch (e) { /* keep 'source' */ }
    via = ` · via <a href="${c.p}" target="_blank" rel="noopener noreferrer">${esc(host)}</a>`;
  }
  return `<p class="photocredit">Photo: ${authorHtml} · ${licenceHtml}${via}</p>`;
}

function fmtSize(t) {
  if (!t.sizeRaw) return null;
  if (t.sizeKind === 'height' && t.heightM) return `${t.heightM} m tall`;
  if (t.sizeKind === 'length' && t.lengthM) return `${t.lengthM} m long`;
  return t.sizeRaw;
}
/**
 * Describe a pin's provenance in our own words. Researcher notes are working
 * material and can contain scratch commentary, so they are summarised rather
 * than echoed; the automated matcher's reasons are already user-safe.
 */
function howPlaced(t) {
  const m = t.coordMatch;
  if (!m) return '';
  if (m.kind === 'researched') {
    const host = t.coordSource ? (() => { try { return new URL(t.coordSource).hostname.replace('www.', ''); } catch (e) { return null; } })() : null;
    const conf = m.confidence === 'high' ? 'located from a source naming the sculpture itself' : 'located from a street address or the venue it stands at';
    return host ? `independently researched: ${conf}, via ${host}.` : `independently researched: ${conf}.`;
  }
  const matched = m.osmName ? ` Matched OpenStreetMap’s “${m.osmName}”.` : '';
  return `${m.why || m.kind}.${matched}`;
}

function precisionBadge(t) {
  if (t.precision === 'town') return { cls:'badge warn', text:'📍 town-level pin' };
  if (t.precision === 'exact-verified') return { cls:'badge', text:'📍 pinpointed (verified)' };
  if (t.precision === 'exact-osm') return { cls:'badge', text:'📍 pinpointed (OSM)' };
  if (t.precision === 'exact-wikivoyage') return { cls:'badge', text:'📍 pinpointed (Wikivoyage)' };
  if (t.precision === 'exact-article') return { cls:'badge', text:'📍 pinpointed (Wikipedia)' };
  if (t.precision === 'exact-inline') return { cls:'badge', text:'📍 pinpointed' };
  return { cls:'badge warn', text:'📍 not placed' };
}

function openDetail(id, pan) {
  const t = THINGS.find((x) => x.id === id);
  if (!t) return;
  const prev = selected; selected = id;
  for (const pid of [prev, id]) {
    if (pid && markers.has(pid)) {
      const th = THINGS.find((x) => x.id === pid);
      if (th) markers.get(pid).setIcon(iconFor(th));
    }
  }

  const c = cat(t.category);
  const pb = precisionBadge(t);
  const inTrip = trip.includes(t.id);
  const size = fmtSize(t);
  const heroSrc = t.image ? photoUrl(t.image) : null;
  const hero = heroSrc
    ? `<img class="dhero" src="${heroSrc}" alt="${esc(t.name)}" loading="lazy"
         onerror="this.outerHTML='<div class=\\'dhero ph\\' aria-hidden=\\'true\\'>${c.emoji}</div>'">`
    : `<div class="dhero ph" aria-hidden="true">${c.emoji}</div>`;

  const facts = [];
  if (t.builtRaw) facts.push(['Built', esc(t.builtRaw) + (t.builtCirca ? ' (approx.)' : '')]);
  if (size) facts.push(['Size', esc(size)]);
  if (t.sizeRaw && size !== t.sizeRaw) facts.push(['Dimensions', esc(t.sizeRaw)]);
  facts.push(['Category', c.emoji + ' ' + c.label]);
  facts.push(['Status', esc(STATUS_LABEL[t.status] || t.status)]);

  const maps = `https://www.google.com/maps/dir/?api=1&destination=${t.lat},${t.lng}`;

  document.getElementById('dscroll').innerHTML = `
    ${hero}
    <div class="dbody">
      ${heroSrc ? photoCredit(t.image) : ''}
      <h2>${esc(t.name)}</h2>
      <p class="dwhere">${esc(where(t))}${where(t) ? ', ' : ''}${esc(t.stateName)}</p>
      <div class="badges">
        <span class="badge" style="background:${c.colour};color:#fff;border-color:#1b1a17">${c.emoji} ${esc(c.label)}</span>
        ${isGone(t) ? `<span class="badge gone">💀 ${esc(STATUS_LABEL[t.status])}</span>` : ''}
        ${t.status === 'relocated' ? '<span class="badge warn">🚚 moved</span>' : ''}
        ${t.status === 'replaced' ? '<span class="badge warn">🔧 rebuilt</span>' : ''}
        <span class="${pb.cls}">${pb.text}</span>
      </div>
      ${t.correction ? `<div class="corrected"><b>${t.addedManually ? 'Added from outside the wiki lists.' : 'We corrected the source.'}</b> ${esc(t.correction.why)}${t.correction.source ? ` <a href="${t.correction.source}" target="_blank" rel="noopener noreferrer">Source</a>` : ''}</div>` : ''}
      ${t.coordMatch ? `<p class="howfound">How this pin was placed: ${esc(howPlaced(t))}</p>` : ''}
      ${t.precision === 'town' ? `<p class="howfound">This pin sits at the centre of ${esc(t.town || t.location || 'the town')}, not on the sculpture: the sources give a town, not a point.</p>` : ''}
      <dl class="facts">${facts.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      ${t.blurb ? `<p class="prose voice">${esc(t.blurb)}</p>` : ''}
      ${t.notes ? `<p class="prose">${esc(t.notes)}</p>` : ''}
      ${t.statusEvidence && !t.notes ? `<p class="prose">${esc(t.statusEvidence)}</p>` : ''}
      <div class="dactions">
        <button class="pillbtn ${inTrip ? '' : 'trip'}" id="addtrip">${inTrip ? '− Remove from trip' : '+ Add to road trip'}</button>
        <a class="pillbtn" href="${maps}" target="_blank" rel="noopener noreferrer">🧭 Directions</a>
        ${t.wikipediaArticle ? `<a class="pillbtn" href="https://en.wikipedia.org/wiki/${encodeURIComponent(t.wikipediaArticle.replace(/ /g,'_'))}" target="_blank" rel="noopener noreferrer">📖 Wikipedia</a>` : ''}
      </div>
      <div class="srclist">
        <b>Where this came from</b>
        ${t.sources.map((s) => s.url ? `<a href="${s.url}" target="_blank" rel="noopener noreferrer">${esc(s.source)}</a>` : esc(s.source)).join(' · ')}
        ${t.coordSource ? `<br>Coordinates: <a href="${t.coordSource}" target="_blank" rel="noopener noreferrer">${esc(new URL(t.coordSource).hostname.replace('www.',''))}</a>` : ''}
        ${t.lat != null ? `<br>${t.lat.toFixed(5)}, ${t.lng.toFixed(5)}` : ''}
      </div>
    </div>`;

  document.getElementById('addtrip').addEventListener('click', () => { toggleTrip(t.id); openDetail(t.id, false); });
  document.getElementById('detail').classList.add('open');
  closeSheets();
  if (window.innerWidth <= 860) document.getElementById('side').classList.remove('open');
  if (pan !== false && t.lat != null) map.setView([t.lat, t.lng], Math.max(map.getZoom(), 13), { animate:true });
  syncHash();
}
document.getElementById('dclose').addEventListener('click', () => {
  document.getElementById('detail').classList.remove('open');
  const prev = selected; selected = null;
  if (prev && markers.has(prev)) {
    const th = THINGS.find((x) => x.id === prev);
    if (th) markers.get(prev).setIcon(iconFor(th));
  }
  syncHash();
});

/* ---------------- road trip ---------------- */
function toggleTrip(id) {
  const i = trip.indexOf(id);
  if (i >= 0) trip.splice(i, 1); else trip.push(id);
  drawTrip(); renderTrip(); updateTripCounts();
}
function haversine(a, b) {
  const R = 6371, dLat = (b[0]-a[0]) * Math.PI/180, dLng = (b[1]-a[1]) * Math.PI/180;
  const la1 = a[0]*Math.PI/180, la2 = b[0]*Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const tripThings = () => trip.map((id) => THINGS.find((t) => t.id === id)).filter((t) => t && t.lat != null);
function tripLegs() {
  const ts = tripThings(); const legs = [];
  for (let i = 1; i < ts.length; i++) legs.push(haversine([ts[i-1].lat, ts[i-1].lng], [ts[i].lat, ts[i].lng]));
  return legs;
}
function drawTrip() {
  const ts = tripThings();
  tripLine.setLatLngs(ts.map((t) => [t.lat, t.lng]));
  tripMarkers.clearLayers();
  ts.forEach((t, i) => {
    L.marker([t.lat, t.lng], {
      icon:L.divIcon({ html:`<div class="tripnum">${i+1}</div>`, className:'', iconSize:[28,28], iconAnchor:[14,14] }),
      interactive:false, zIndexOffset:1000,
    }).addTo(tripMarkers);
  });
}
/** Nearest-neighbour ordering — a decent, instant approximation. */
function optimiseTrip() {
  const ts = tripThings();
  if (ts.length < 3) return;
  const remaining = ts.slice(1);
  const order = [ts[0]];
  while (remaining.length) {
    const last = order[order.length-1];
    let bi = 0, bd = Infinity;
    remaining.forEach((t, i) => {
      const d = haversine([last.lat,last.lng],[t.lat,t.lng]);
      if (d < bd) { bd = d; bi = i; }
    });
    order.push(remaining.splice(bi,1)[0]);
  }
  trip = order.map((t) => t.id);
  drawTrip(); renderTrip();
}
function renderTrip() {
  const ts = tripThings();
  const body = document.getElementById('tripbody');
  if (!ts.length) {
    body.innerHTML = `<p class="empty">No stops yet. Open any big thing and hit <b>“Add to road trip”</b>, then come back: we'll chain them up and total the distance.<br><br>Or hit <b>🎲 Spin &amp; drive</b> for a random one.</p>`;
    return;
  }
  const legs = tripLegs();
  const total = legs.reduce((a,b) => a+b, 0);
  const hours = total / 80;
  const gone = ts.filter(isGone).length;
  const fuzzy = ts.filter(isFuzzy).length;
  body.innerHTML = `
    <div class="tripsum">
      <b>${ts.length} stops · ${Math.round(total).toLocaleString()} km</b><br>
      Roughly ${hours < 1 ? '<1' : Math.round(hours)} hour${Math.round(hours) === 1 ? '' : 's'} of driving as the crow drives:
      straight-line distance at 80 km/h, so treat it as a lower bound on a real road route.
      ${gone ? `<br>⚠️ ${gone} of these ${gone === 1 ? 'is' : 'are'} demolished or gone. Bold choice.` : ''}
      ${fuzzy ? `<br>📍 ${fuzzy} ${fuzzy === 1 ? 'stop is' : 'stops are'} pinned to the town, not the sculpture.` : ''}
    </div>
    ${ts.map((t, i) => `
      <div class="triprow">
        <span class="ord">${i+1}</span>
        <span style="flex:1;min-width:0">
          <b>${cat(t.category).emoji} ${esc(t.name)}</b><br>
          <span class="leg">${esc(t.location || '')}, ${t.state}${i ? ` · ${Math.round(legs[i-1]).toLocaleString()} km from stop ${i}` : ''}</span>
        </span>
        <button class="pillbtn" data-drop="${t.id}" aria-label="Remove ${esc(t.name)}">✕</button>
      </div>`).join('')}
    <p style="margin-top:14px"><a class="pillbtn" href="https://www.google.com/maps/dir/${ts.map((t) => `${t.lat},${t.lng}`).join('/')}" target="_blank" rel="noopener noreferrer">🧭 Open all ${ts.length} stops in Google Maps</a></p>`;
  body.querySelectorAll('[data-drop]').forEach((b) => b.addEventListener('click', () => toggleTrip(b.dataset.drop)));
}
function updateTripCounts() {
  document.getElementById('tripcount').textContent = trip.length ? `(${trip.length})` : '';
  const m = document.getElementById('mtripcount');
  m.hidden = !trip.length; m.textContent = trip.length;
}

/* ---------------- superlatives ---------------- */
function renderStats() {
  const standing = THINGS.filter((t) => !isGone(t));
  const withSize = THINGS.filter((t) => t.sizeMaxM);
  const tallest = [...THINGS].filter((t) => t.heightM).sort((a,b) => b.heightM - a.heightM)[0];
  const longest = [...THINGS].filter((t) => t.lengthM).sort((a,b) => b.lengthM - a.lengthM)[0];
  const biggest = [...withSize].sort((a,b) => b.sizeMaxM - a.sizeMaxM)[0];
  const oldest = [...THINGS].filter((t) => t.builtYear).sort((a,b) => a.builtYear - b.builtYear)[0];
  const newest = [...THINGS].filter((t) => t.builtYear).sort((a,b) => b.builtYear - a.builtYear)[0];
  const dead = THINGS.filter(isGone);
  const byState = {}; for (const t of THINGS) byState[t.state] = (byState[t.state]||0)+1;
  const byCat = {}; for (const t of THINGS) byCat[t.category] = (byCat[t.category]||0)+1;
  const deadByState = {}; for (const t of dead) deadByState[t.state] = (deadByState[t.state]||0)+1;
  const topDead = Object.entries(deadByState).sort((a,b) => b[1]-a[1])[0];
  const perCapita = Object.entries(byState).sort((a,b) => b[1]-a[1]);
  const dupes = {};
  for (const t of THINGS) { const k = t.name.toLowerCase().replace(/^the /,''); dupes[k] = (dupes[k]||0)+1; }
  const topDupe = Object.entries(dupes).sort((a,b) => b[1]-a[1])[0];

  const card = (k, v, m) => `<div class="statcard"><div class="k">${k}</div><div class="v">${v}</div><div class="m">${m}</div></div>`;
  const bars = (obj, fmt) => {
    const max = Math.max(...Object.values(obj));
    return '<div class="bars">' + Object.entries(obj).sort((a,b) => b[1]-a[1]).map(([k,n]) =>
      `<div class="bar" title="${esc(String(fmt(k)))}: ${n}"><span class="lbl">${fmt(k)}</span><span class="t"><span class="f" style="width:${Math.max(2, n / max * 100).toFixed(1)}%"></span></span><span class="n">${n}</span></div>`
    ).join('') + '</div>';
  };

  document.getElementById('statbody').innerHTML = `
    <div class="statgrid">
      ${card('Mapped here', THINGS.length, `Every one placed on the map. Amy Clarke's census counted ${META.claimedNationalTotal.toLocaleString()} in Australia: this is the verifiable subset.`)}
      ${card('Australia vs Canada', '1,075 : 1,250', 'The same census counted 1,250 Big Things in Canada, so Australia is not even the world leader at its own signature obsession.')}
      ${card('Still standing', standing.length, `${dead.length} have been demolished or removed.`)}
      ${biggest ? card('Biggest, any axis', `${biggest.sizeMaxM} m`, `${esc(biggest.name)}, ${esc(biggest.location||'')}, ${isGone(biggest) ? 'demolished' : 'still there'}. The source doesn't say which axis, so we don't call it a height.`) : ''}
      ${tallest ? card('Tallest', `${tallest.heightM} m`, `${esc(tallest.name)}, ${esc(tallest.location||'')} (${tallest.state}), measured as a height by the source.`) : ''}
      ${longest ? card('Longest', `${longest.lengthM} m`, `${esc(longest.name)}, ${esc(longest.location||'')}, ${isGone(longest) ? 'now demolished' : 'still there'}`) : ''}
      ${oldest ? card('Oldest', oldest.builtYear, `${esc(oldest.name)}, ${esc(oldest.location||'')} (${oldest.state})`) : ''}
      ${newest ? card('Newest', newest.builtYear, `${esc(newest.name)}, ${esc(newest.location||'')} (${newest.state})`) : ''}
      ${card('Biggest hoarder', perCapita[0][0], `${perCapita[0][1]} big things, ahead of ${perCapita[1][0]} on ${perCapita[1][1]}.`)}
      ${topDead ? card('Most careless', topDead[0], `${topDead[1]} big things lost to demolition, fire or removal.`) : ''}
      ${topDupe && topDupe[1] > 1 ? card('Most copied', `×${topDupe[1]}`, `Australia has ${topDupe[1]} things called “${esc(topDupe[0])}”.`) : ''}
      ${card('Precisely placed', `${Math.round(THINGS.filter((t) => !isFuzzy(t)).length / THINGS.length * 100)}%`, `The rest sit at their town's centre: filter them out with “only pinpointed pins”.`)}
    </div>
    <h3 style="margin:22px 0 8px;font-size:17px">Big things by state</h3>
    ${bars(byState, (k) => k)}
    <h3 style="margin:20px 0 8px;font-size:17px">Big things by kind</h3>
    ${bars(byCat, (k) => cat(k).emoji + ' ' + (cat(k).short || cat(k).label))}
    <p style="font-size:12px;color:var(--ink-soft);margin-top:18px;line-height:1.55">
      The national figure is Amy Clarke's, from
      <a href="https://doi.org/10.1080/14443058.2022.2144928" target="_blank" rel="noopener noreferrer">“Making a Mark: Displays of Regional and National Identity in the Big Things of Australia and Canada”</a>,
      <em>Journal of Australian Studies</em> 47(2), 2023, published online in November 2022. It is a census of Australia alone
      (the paper's companion count for Canada is 1,250) and it is not a published list, which is why this map can show
      ${THINGS.length} rather than all ${META.claimedNationalTotal.toLocaleString()}.
    </p>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:12px;line-height:1.55">
      Sizes are quoted as the source gives them, and the source is not consistently quoting a height:
      ${biggest ? esc(biggest.name) : 'The Giant Worm'} measured ${biggest ? biggest.sizeMaxM : 250} m along its longest axis
      because it was a walk-through tunnel, not a tower. Where the source is ambiguous, this map declines to claim a height.
    </p>`;
}

/* ---------------- list ---------------- */
function renderList() {
  document.getElementById('listtitle').textContent = `${visible.length} match${visible.length === 1 ? '' : 'es'}`;
  const body = document.getElementById('listbody');
  if (!visible.length) { body.innerHTML = `<p class="empty">Nothing matches. Try clearing a filter.</p>`; return; }
  body.innerHTML = visible.slice(0, 400).map((t) => `
    <button class="resultrow" data-go="${t.id}">
      <span class="em">${cat(t.category).emoji}</span>
      <span style="flex:1;min-width:0">
        <span class="nm">${esc(t.name)}${isGone(t) ? ' 💀' : ''}</span><br>
        <span class="lc">${esc(t.location || t.town || '')}, ${t.state}${t.builtYear ? ` · ${t.builtYear}` : ''}${isFuzzy(t) ? ' · town-level pin' : ''}</span>
      </span>
    </button>`).join('') + (visible.length > 400 ? `<p class="empty">…and ${visible.length-400} more. Narrow the filters to see them.</p>` : '');
  body.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => openDetail(b.dataset.go, true)));
}

/* ---------------- sheets & chrome ---------------- */
function closeSheets() {
  document.querySelectorAll('.sheet').forEach((s) => s.classList.remove('open'));
}
function openSheet(id) {
  const wasOpen = document.getElementById(id).classList.contains('open');
  closeSheets();
  document.getElementById('detail').classList.remove('open');
  if (!wasOpen) document.getElementById(id).classList.add('open');
  if (window.innerWidth <= 860) document.getElementById('side').classList.remove('open');
}
document.querySelectorAll('[data-close-sheet]').forEach((b) =>
  b.addEventListener('click', () => document.getElementById(b.dataset.closeSheet).classList.remove('open')));

document.getElementById('q').addEventListener('input', (e) => {
  F.q = e.target.value.trim();
  // Open (or close) the results sheet *before* refresh() runs, so its fit
  // logic measures the sheet's real on-screen height instead of the height
  // from a moment ago. refresh() re-renders the list itself once it's open.
  if (F.q.length > 1) document.getElementById('listsheet').classList.add('open');
  else if (!F.q) document.getElementById('listsheet').classList.remove('open');
  // Fit whenever there's an active query — otherwise a match outside the
  // current view (e.g. searching "Gosford" while looking at Perth) gets
  // added to the map but stays off-screen, with only the sidebar count
  // showing it exists.
  refresh(F.q.length > 0);
});
document.getElementById('listbtn').addEventListener('click', () => { renderList(); openSheet('listsheet'); });
document.getElementById('tripbtn').addEventListener('click', () => { renderTrip(); openSheet('tripsheet'); });
document.getElementById('statsbtn').addEventListener('click', () => { renderStats(); openSheet('statsheet'); });
document.getElementById('mtrip').addEventListener('click', () => { renderTrip(); openSheet('tripsheet'); });
document.getElementById('tripopt').addEventListener('click', optimiseTrip);
document.getElementById('tripclear').addEventListener('click', () => { trip = []; drawTrip(); renderTrip(); updateTripCounts(); });

/* ---------------- locate me ---------------- */
const meIcon = L.divIcon({ className:'', html:'<div class="youarehere"></div>', iconSize:[16,16], iconAnchor:[8,8] });
let meMarker = null;
let meCircle = null;

function setLocateBusy(busy) {
  const btn = document.getElementById('locatebtn');
  btn.disabled = busy;
  btn.textContent = busy ? '📍 Locating…' : '📍 Locate me';
  document.getElementById('mlocate').disabled = busy;
}

/** Everything currently on the map, ordered by straight-line distance from [lat,lng]. */
function byDistanceFrom(lat, lng) {
  return THINGS.filter(matches).filter((t) => t.lat != null)
    .map((t) => ({ t, d:haversine([lat, lng], [t.lat, t.lng]) }))
    .sort((a, b) => a.d - b.d);
}

function showNearby(lat, lng) {
  const NEARBY_KM = 25;
  const ranked = byDistanceFrom(lat, lng);
  const within = ranked.filter((r) => r.d <= NEARBY_KM);
  const results = (within.length ? within : ranked).slice(0, 15);
  document.getElementById('listtitle').textContent = !ranked.length ? 'Nothing matches your filters'
    : within.length ? `${within.length} within ${NEARBY_KM} km`
    : `Nearest ${results.length} (none within ${NEARBY_KM} km)`;
  const body = document.getElementById('listbody');
  if (!results.length) { body.innerHTML = `<p class="empty">Nothing matches your current filters.</p>`; openSheet('listsheet'); return; }
  body.innerHTML = results.map(({ t, d }) => `
    <button class="resultrow" data-go="${t.id}">
      <span class="em">${cat(t.category).emoji}</span>
      <span style="flex:1;min-width:0">
        <span class="nm">${esc(t.name)}${isGone(t) ? ' 💀' : ''}</span><br>
        <span class="lc">${esc(t.location || t.town || '')}, ${t.state} · ${d < 1 ? Math.round(d * 1000) + ' m' : Math.round(d) + ' km'}</span>
      </span>
    </button>`).join('');
  body.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => openDetail(b.dataset.go, true)));
  openSheet('listsheet');
}

function showLocateError(message) {
  document.getElementById('listtitle').textContent = 'Location unavailable';
  document.getElementById('listbody').innerHTML = `<p class="empty">${esc(message)}</p>`;
  openSheet('listsheet');
}

function doLocate() {
  setLocateBusy(true);
  map.locate({ enableHighAccuracy:true, timeout:10000, maximumAge:60000 });
}
document.getElementById('locatebtn').addEventListener('click', doLocate);
document.getElementById('mlocate').addEventListener('click', doLocate);

map.on('locationfound', (e) => {
  setLocateBusy(false);
  if (meMarker) map.removeLayer(meMarker);
  if (meCircle) map.removeLayer(meCircle);
  meMarker = L.marker(e.latlng, { icon:meIcon, zIndexOffset:1000, interactive:false }).addTo(map);
  if (e.accuracy) {
    meCircle = L.circle(e.latlng, { radius:e.accuracy, color:'#2a7fbf', weight:1, fillColor:'#2a7fbf', fillOpacity:.08, interactive:false }).addTo(map);
  }
  map.setView(e.latlng, Math.max(map.getZoom(), 11), { animate:true });
  showNearby(e.latlng.lat, e.latlng.lng);
});
map.on('locationerror', (e) => {
  setLocateBusy(false);
  // GeolocationPositionError codes, per the spec Leaflet passes through: 1
  // permission denied, 2 position unavailable, 3 timed out.
  const byCode = {
    1: 'Location access was denied. Allow location access for this site in your browser settings to see big things near you.',
    2: "Your device couldn't work out where it is. Try again in a moment.",
    3: 'Finding your location took too long. Try again.',
  };
  showLocateError(byCode[e.code] || 'Could not get your location.');
});

function spin() {
  const pool = visible.length ? visible : THINGS;
  const t = pool[Math.floor(Math.random() * pool.length)];
  openDetail(t.id, true);
}
document.getElementById('randombtn').addEventListener('click', spin);
document.getElementById('mrandom').addEventListener('click', spin);

document.getElementById('resetbtn').addEventListener('click', () => {
  F.q = ''; F.states.clear(); F.cats.clear(); F.eras.clear(); F.hideGone = false; F.exactOnly = false;
  document.getElementById('q').value = '';
  document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed','false'));
  document.querySelectorAll('.switch input').forEach((c) => { c.checked = false; });
  closeSheets();
  refresh(false);
  map.fitBounds(AU_VIEW, { padding:[4, 4], animate:true });
});

const side = document.getElementById('side');
document.getElementById('mfilter').addEventListener('click', () => {
  closeSheets(); document.getElementById('detail').classList.remove('open');
  side.classList.toggle('open');
});
document.getElementById('msearch').addEventListener('click', () => {
  const willOpen = !side.classList.contains('open');
  closeSheets(); document.getElementById('detail').classList.remove('open');
  side.classList.toggle('open', willOpen);
  if (willOpen) setTimeout(() => document.getElementById('q').focus(), 260);
});
// Mobile-only close affordances for #side: unlike every other sheet, it had
// none at all — the grabber looked tappable but did nothing.
document.getElementById('sideclose').addEventListener('click', () => side.classList.remove('open'));
document.getElementById('grabber').addEventListener('click', () => side.classList.remove('open'));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeSheets();
    document.getElementById('detail').classList.remove('open');
    if (window.innerWidth <= 860) side.classList.remove('open');
  }
  if (e.key === '/' && document.activeElement.id !== 'q') { e.preventDefault(); document.getElementById('q').focus(); }
});

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* ---------------- boot ---------------- */
document.getElementById('credits').innerHTML = [
  `<a href="about.html">About this project</a> ·`,
  'Data from <a href="https://en.wikipedia.org/wiki/Big_things_(Australia)" target="_blank" rel="noopener noreferrer">Wikipedia</a>,',
  '<a href="https://en.wikivoyage.org/wiki/Australia%27s_big_things" target="_blank" rel="noopener noreferrer">Wikivoyage</a> (CC BY-SA),',
  '<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> (ODbL),',
  '<a href="https://landofthebigs.com/" target="_blank" rel="noopener noreferrer">Land of the Bigs</a> and',
  '<a href="https://www.aussiebigthings.com.au/" target="_blank" rel="noopener noreferrer">Aussie Big Things</a>.',
  'Photographs from <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>,',
  'each under its own free licence and credited on the card.',
  'Basemap tiles © OpenStreetMap contributors once zoomed in; the continent view is a <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener noreferrer">Natural Earth</a> coastline (public domain).',
].join(' ');

const s = META.stats;
document.getElementById('counts').innerHTML = [
  `<span class="count"><b>${s.total}</b> mapped</span>`,
  `<span class="count"><b>${s.exact}</b> pinpointed</span>`,
  `<span class="count"><b>${(s.byStatus.demolished||0) + (s.byStatus.removed||0)}</b> lost</span>`,
  `<span class="count" id="claimchip" title="Clarke (2023) counted ${META.claimedNationalTotal.toLocaleString()} Big Things in Australia, and 1,250 in Canada.">of <b>${META.claimedNationalTotal.toLocaleString()}</b> claimed</span>`,
].join('');
buildFilters();
refresh(false);
updateTripCounts();

/* ---------------- apply a direct link, if the URL asked for one ---------------- */
if (hashThing && THINGS.some((t) => t.id === hashThing)) {
  openDetail(hashThing, true);
} else if (hashStates.length) {
  const validStates = hashStates.filter((s) => STATES.includes(s));
  if (validStates.length) {
    validStates.forEach((s) => F.states.add(s));
    document.querySelectorAll('.chip[data-kind="state"]').forEach((c) => {
      if (F.states.has(c.dataset.value)) c.setAttribute('aria-pressed', 'true');
    });
    refresh(true);
  }
}
</script>
</body>
</html>
