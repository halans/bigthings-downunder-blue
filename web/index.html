:"https://en.wikipedia.org/wiki/Hills_Hoist"}},{"@type":"ListItem","position":313,"item":{"@type":"Place","name":"The Big Kangaroo","url":"https://bigthings.downunder.blue/#thing=10b5e13340","description":"Also known as \"Rooey II\", the Big Kangaroo can be found at Border Village in South Australia, located just shy of the border with West Australia. Made from papier-mâché and fibreglass over a steel frame, from a design by Bill Metheral, Rooey was intended to capitalise on traffic journeying to Perth for the America's Cup, and was opened in 1986.","geo":{"@type":"GeoCoordinates","latitude":-31.637838,"longitude":129.004116},"address":{"@type":"PostalAddress","addressLocality":"Border Village","addressRegion":"South Australia","addressCountry":"AU"},"image":"https://bigthings.downunder.blue/img/rooey-ii-border-village-723457.jpg"}},{"@type":"ListItem","position":314,"item":{"@type":"Place","name":"The Big Lobster","url":"https://bigthings.downunder.blue/#thing=0556100d53","description":"Known locally as \"Larry\", the Big Lobster was designed and built by Paul Kelly (who also designed the Big Scotsman) as a means of attracting attention to the visitor centre and restaurant at which it is located. It was built in six months out of a steel frame with a fibreglass shell. The size is incorrectly said to have been an error: the original plans were drawn in feet, but the designer misinterpreted them to be metres. The Specifications actually required the length to be ~12 metres long and it is a fraction longer than this.","geo":{"@type":"GeoCoordinates","latitude":-36.823778,"longitude":139.863194},"address":{"@type":"PostalAddress","addressLocality":"Kingston SE","addressRegion":"South Australia","addressCountry":"AU"},"image":"https://bigthings.downunder.blue/img/kingston-se-lobster-ab9171.jpg","sameAs":"https://en.wikipedia.org/wiki/The_Big_Lobster"}},{"@type":"ListItem","position":315,"item":{"@type":"Place","name":"The Big Olive","url":"https://bigthings.downunder.blue/#thing=9bd9d6079f","description":"The Big Olive was constructed to attract tourists to The Big Olive processing plant and visitor centre. Located just outside Tailem Bend, it consists of two olives – one green and one black – which together stand at 8 m and weigh over 1 t. The olives were constructed out of fibreglass by The Newell Group, and were placed on the site in April 2005.","geo":{"@type":"GeoCoordinates","latitude":-35.274727,"longitude":139.469766},"address":{"@type":"PostalAddress","addressLocality":"Tailem Bend","addressRegion":"South Australia","addressCountry":"AU"},"image":"https://bigthings.downunder.blue/img/big-olive-ceaaaf.jpg"}},{"@type":"ListItem","position":316,"item":{"@type":"Place","name":"The Big Orange","url":"https://bigthings.downunder.blue/#thing=3dc0eb1331","description":"Located in the South Australian Riverland, the Big Orange was designed by Adelaide-based architect John Twopenny. It is constructed with fiberglass panels covering a steel frame, with the entire structure weighing in the vicinity of 85 t. The structure consists of four levels, with a function room on the first floor, a souvenir shop and cafe on the second, a mural depicting the local scenery on the third, and a lookout on the fourth. The Big Orange closed in 2004, but may still be photographed from the road, and in 2023 plans were approved to redevelop the site while retaining the Big Orange as the centrepiece or the new development.","geo":{"@type":"GeoCoordinates","latitude":-34.246389,"longitude":140.620861},"address":{"@type":"PostalAddress","addressRegion":"South Australia","addressCountry":"AU"},"image":"https://bigthings.downunder.blue/img/big-orange-d2600c.jpg","sameAs":"https://en.wikipedia.org/wiki/Big_Orange_(South_Australia)"}},{"@type":"ListItem","position":317,"item":{"@type":"Place","name":"The Big Oyster","url":"https://bigthings.downunder.blue/#thing=ccbae1a34d","description":"The Big Oyster was originally built as a float for Ceduna's annual Oysterfest. Built by Leon Veerhuis out of ferro-concrete, it was retired from parade duties in 1994. It is located next to an information booth on Eyre Highway just north of Ceduna.","geo":{"@type":"GeoCoordinates","latitude":-32.116667,"longitude":133.666667},"address":{"@type":"PostalAddress","addressLocality":"Ceduna","addressRegion":"South Australia","addressCountry":"AU"},"image":"https://bigthings.downunder.blue/img/big-oyster-ceduna-south-australia-62b754.jpg","additionalProperty":[{"@type":"PropertyValue","name":"status","value":"removed"}]}},{"@type":"ListItem","position":318,"item":{"@type":"Place","name":"The Big Pelican","url":"https://bigthings.downunder.blue/#thing=d90d03ef10","description":"The Big Pelican was originally constructed as a float for a local Mardi Gras in 1979. After being employed for this purpose on a number of occasions, including once in Adelaide, the papier-mâché structure was remodelled, and, in 1992, it was overlaid with fibreglass. Today it can be found at the Loxton Caravan Park.","geo":{"@type":"GeoCoordinates","latitude":-34.448081,"longitude":140.549896},"address":{"@type":"PostalAddress","addressRegion":"South Australia","addressCountry":"AU"},"image":"https://bigthings.downunder.blue/img/big-pelican-at-loxton-83d06c.jpg"}},{"@type":"ListItem","position":319,"item":{"@type":"Place","name":"The Big Pigeon","url":"https://bigthings.downunder.blue/#thing=2931d89616","description":"The Big Pigeon is a mirrored stainless steel sculpture by South Australian artist Paul Sloan, installed in Rundle Mall Adelaide, on 6 November 2020. The pigeon is more than 2 metres tall, and cost $174,000.","geo":{"@type":"GeoCoordinates","latitude":-34.922987,"longitude":138.601844},"address":{"@type":"PostalAddress","addressLocality":"Rundle Mall","addressRegion":"South Australia","addressCountry":"AU"},"image":"https://bigthings.downunder.blue/img/big-pigeon-46ae1d.jpg"}},{"@type":"ListItem","position":320,"item":{"@type":"Place","name":"The Big Prayin <link rel="stylesheet" href="vendor/fonts.css">

<style>
:root{
  --ink:#1b1a17; --ink-soft:#4a463e; --cream:#fdf6e8; --cream-2:#f6ebd6; --paper:#fffdf7;
  --earth:#c8452b; --sun:#f0a71c; --euc:#2f7d52; --sky:#2a7fbf; --plum:#7c4dab;
  --prawn:#e0567f; --steel:#5b6472; --brew:#b5651d; --void:#4b4a67;
  --line:#e3d6bd; --shadow:0 2px 0 rgba(27,26,23,.14), 0 10px 30px -12px rgba(27,26,23,.4);
  --sheet-h:52vh;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink); background:var(--cream);
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
h1,h2,h3,.display{font-family:Caprasimo,Inter,system-ui,sans-serif;font-weight:400;font-style:normal;letter-spacing:.2px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--sky)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:352px 1fr;height:100%;height:100dvh;overflow:hidden}
#map{height:100%;width:100%;background:#dcd2bd;z-index:1}
#mapwrap{position:relative;min-width:0}

/* ---------- sidebar ---------- */
#side{
  background:var(--paper);border-right:3px solid var(--ink);
  display:flex;flex-direction:column;min-height:0;z-index:5;
}
.brand{padding:16px 18px 12px;border-bottom:2px dashed var(--line);position:relative}
.brand h1{margin:0;font-size:31px;line-height:.96;color:var(--earth);text-wrap:balance}
.brand h1 em{font-style:normal;color:var(--ink);display:block;font-size:19px;margin-top:5px}
.brand .tag{margin:9px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink-soft)}
.counts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.count{background:var(--cream-2);border:1.5px solid var(--ink);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600}
.count b{font-variant-numeric:tabular-nums}

.aboutlink{margin:10px 0 0;font-size:12px;font-weight:600}
.aboutlink a{color:var(--earth);text-decoration:underline;text-underline-offset:2px}
.searchrow{padding:12px 14px 10px;display:flex;gap:8px}
#q{
  flex:1;min-width:0;padding:10px 12px;border:2px solid var(--ink);border-radius:11px;
  background:var(--cream);font-size:14.5px;font-weight:500;
}
#q:focus{outline:3px solid var(--sun);outline-offset:1px}
.iconbtn{
  border:2px solid var(--ink);border-radius:11px;background:var(--sun);
  width:42px;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 0 var(--ink);
  transition:transform .08s;
}
.iconbtn:active{transform:translateY(2px);box-shadow:none}

.filters{padding:0 14px 8px;overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.fgroup{margin:0 0 14px}
.flabel{
  font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 7px;display:flex;justify-content:space-between;align-items:baseline
}
.flabel button{font-size:10.5px;font-weight:700;color:var(--earth);text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1.5px solid var(--ink);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;
  background:var(--paper);display:inline-flex;align-items:center;gap:5px;line-height:1.15;
  transition:background .12s,transform .08s;
}
.chip:hover{background:var(--cream-2)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.chip .n{font-size:10.5px;opacity:.62;font-variant-numeric:tabular-nums}
.chip .dot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.35);flex:0 0 auto}
.switch{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;font-weight:500;line-height:1.35;cursor:pointer;color:var(--ink-soft)}
.switch input{margin:1px 0 0;accent-color:var(--earth);width:16px;height:16px;flex:0 0 auto}

.sidefoot{border-top:2px dashed var(--line);padding:10px 14px;display:flex;gap:7px;flex-wrap:wrap;background:var(--paper)}
.pillbtn{
  border:2px solid var(--ink);border-radius:11px;padding:7px 11px;font-size:12.5px;font-weight:700;
  background:var(--cream);box-shadow:0 2px 0 var(--ink);transition:transform .08s;
}
.pillbtn:active{transform:translateY(2px);box-shadow:none}
.pillbtn.hot{background:var(--sun)}
.pillbtn.trip{background:var(--euc);color:#fff}
.iconbtn:disabled,.pillbtn:disabled{opacity:.55;cursor:not-allowed}
.credits{font-size:10.5px;color:var(--ink-soft);padding:0 14px 12px;line-height:1.5}
.credits a{color:var(--ink-soft)}

/* ---------- map furniture ---------- */
.leaflet-container{font-family:Inter,sans-serif;background:#dcd2bd}
.pin{
  width:34px;height:34px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);
  border:2.5px solid var(--ink);display:grid;place-items:center;
  box-shadow:0 3px 7px rgba(0,0,0,.38);
}
.pin span{transform:rotate(45deg);font-size:16px;line-height:1;filter:saturate(1.1)}
.pin.fuzzy{border-style:dashed;opacity:.94}
.pin.gone{filter:grayscale(.85);opacity:.72}
.pin.sel{outline:3px solid var(--sun);outline-offset:2px;z-index:900!important}
.youarehere{width:16px;height:16px;border-radius:50%;background:var(--sky);border:3px solid #fff;box-shadow:0 0 0 4px rgba(42,127,191,.35),0 2px 6px rgba(0,0,0,.35)}
.clus{
  background:var(--paper);border:2.5px solid var(--ink);border-radius:50%;
  display:grid;place-items:center;font-weight:700;font-family:Caprasimo,Inter,sans-serif;
  box-shadow:0 3px 8px rgba(0,0,0,.28);color:var(--ink);
}
.tripnum{
  background:var(--euc);color:#fff;border:2.5px solid var(--ink);border-radius:50%;
  width:28px;height:28px;display:grid;place-items:center;font-weight:700;font-size:13px;
  font-variant-numeric:tabular-nums;box-shadow:0 3px 7px rgba(0,0,0,.3);
}
.leaflet-bar a{border-radius:0}
/* Place-name labels: opt in (labels-on) and only past a zoom worth reading
   at (labels-zoom) — 477 permanent tooltips at the continent view would be
   unreadable clutter, not a feature. */
.pinlabel{
  background:var(--paper);border:1.5px solid var(--ink);border-radius:7px;
  padding:1px 7px;font-size:11.5px;font-weight:700;color:var(--ink);
  box-shadow:0 1px 0 var(--ink);white-space:nowrap;
}
.pinlabel::before{border-top-color:var(--ink)}
#map:not(.labels-on) .pinlabel,#map.labels-on:not(.labels-zoom) .pinlabel{display:none}
#mapnote{
  position:absolute;left:10px;bottom:10px;z-index:400;background:rgba(255,253,247,.93);
  border:1.5px solid var(--ink);border-radius:9px;padding:5px 9px;font-size:11px;font-weight:600;
  pointer-events:none;max-width:min(60%,320px)
}

/* ---------- detail panel ---------- */
#detail{
  position:absolute;top:0;right:0;width:370px;max-width:100%;height:100%;
  background:var(--paper);border-left:3px solid var(--ink);z-index:600;
  transform:translateX(101%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-14px 0 34px -18px rgba(27,26,23,.5)
}
#detail.open{transform:none}
.dclose{
  position:absolute;top:10px;right:10px;z-index:3;width:34px;height:34px;border-radius:50%;
  background:var(--paper);border:2px solid var(--ink);font-size:17px;display:grid;place-items:center;
  box-shadow:0 2px 0 var(--ink)
}
/* The permanent desktop sidebar has nothing to close; #sideclose only
   exists for its mobile incarnation as a bottom sheet (see media query). */
#sideclose{display:none}
.dscroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.dhero{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--cream-2);display:block;border-bottom:2px solid var(--ink)}
.dhero.ph{display:grid;place-items:center;font-size:62px;aspect-ratio:16/9}
.dbody{padding:16px 18px 26px}
.dbody h2{margin:0 0 3px;font-size:26px;line-height:1.05;color:var(--earth)}
.photocredit{font-size:10.5px;line-height:1.45;color:var(--ink-soft);margin:0 0 10px}
.photocredit a{color:var(--ink-soft)}
.dwhere{font-size:13.5px;font-weight:600;color:var(--ink-soft);margin:0 0 12px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.badge{border:1.5px solid var(--ink);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;background:var(--cream-2)}
.badge.warn{background:#ffe9c9}
.badge.gone{background:#e9e6e0;color:#5f5b53}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin:0 0 14px}
.facts dt{font-weight:700;color:var(--ink-soft)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.prose{font-size:13.5px;line-height:1.55;margin:0 0 12px;color:var(--ink)}
.prose.voice{
  background:var(--cream-2);border-left:4px solid var(--sun);padding:10px 12px;border-radius:0 9px 9px 0;
  font-size:13px
}
.dactions{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 12px}
.srclist{font-size:11.5px;color:var(--ink-soft);line-height:1.6;border-top:2px dashed var(--line);padding-top:10px}
.srclist b{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.corrected{background:#fff4d6;border:1.5px solid var(--sun);border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.5;margin:0 0 12px}
.howfound{font-size:11.5px;line-height:1.5;color:var(--ink-soft);margin:0 0 12px;padding-left:9px;border-left:2px solid var(--line)}

/* ---------- sheets (trip / stats / list) ---------- */
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:650;background:var(--paper);
  border-top:3px solid var(--ink);border-radius:16px 16px 0 0;max-height:74%;
  transform:translateY(101%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:0 -14px 34px -18px rgba(27,26,23,.45)
}
.sheet.open{transform:none}
.shead{display:flex;align-items:center;gap:10px;padding:13px 16px 10px;border-bottom:2px dashed var(--line)}
.shead h3{margin:0;font-size:20px;flex:1}
.sbody{overflow-y:auto;padding:14px 16px 22px;-webkit-overflow-scrolling:touch}
.triprow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dotted var(--line);font-size:13.5px}
.triprow .ord{background:var(--euc);color:#fff;border-radius:50%;width:23px;height:23px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}
.triprow .leg{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tripsum{background:var(--cream-2);border:2px solid var(--ink);border-radius:11px;padding:11px 13px;margin:0 0 13px;font-size:13.5px;line-height:1.5}
.tripsum b{font-size:21px;font-family:Caprasimo,Inter,sans-serif;font-weight:400}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px}
.statcard{border:2px solid var(--ink);border-radius:12px;padding:11px 12px;background:var(--cream)}
.statcard .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.statcard .v{font-family:Caprasimo,Inter,sans-serif;font-weight:400;font-size:22px;line-height:1.12;margin:3px 0 2px;color:var(--earth)}
.statcard .m{font-size:11.5px;color:var(--ink-soft);line-height:1.4}
.bars{margin-top:6px}
.bar{display:grid;grid-template-columns:76px 1fr auto;gap:8px;align-items:center;font-size:12px;margin-bottom:5px}
.bar .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar .t{height:11px;background:var(--cream-2);border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
/* The fill must be a block: a span stays inline, and width/height simply do
   not apply to non-replaced inline elements — which rendered every bar as an
   empty outline. The track is a plain block, so it does not blockify its
   child the way the grid row above blockifies its own. */
.bar .f{display:block;height:100%;background:var(--sun);border-radius:999px}
.bar .n{font-variant-numeric:tabular-nums;font-weight:600;font-size:11.5px}
.resultrow{
  display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 4px;
  border-bottom:1px dotted var(--line);font-size:13.5px
}
.resultrow:hover{background:var(--cream-2)}
.resultrow .em{font-size:19px;flex:0 0 auto}
.resultrow .nm{font-weight:600;line-height:1.2}
.resultrow .lc{font-size:11.5px;color:var(--ink-soft)}
.empty{text-align:center;padding:26px 12px;color:var(--ink-soft);font-size:13.5px}

/* ---------- mobile ---------- */
#mobilebar{display:none}
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr}
  #side{
    position:absolute;left:0;right:0;bottom:0;top:auto;height:auto;max-height:82%;
    border-right:0;border-top:3px solid var(--ink);border-radius:16px 16px 0 0;z-index:660;
    transform:translateY(101%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  }
  #side.open{transform:none}
  /* On mobile #side is a dismissable sheet, not the permanent sidebar —
     unlike every other sheet, it had no close button at all. The grabber
     looked tappable (it's the universal "drag to dismiss" affordance) but
     did nothing; #sideclose gives it an unambiguous one. */
  #sideclose{display:grid}
  /* The sheet is opened specifically to search or filter — the full
     marketing intro and footer attribution (both sized for a permanent
     desktop sidebar) were otherwise eating most of its height, leaving
     .filters a near-unusable sliver to scroll 477 things' worth of chips
     in. The compact title in #mobilebar already covers the brand; the
     about link stays, since it's the only route to the About page here. */
  .brand{padding:10px 16px 8px}
  .brand h1{font-size:22px}
  .brand .tag,.brand .counts{display:none}
  #credits{display:none}
  /* Below 16px, iOS Safari zooms the whole page in when this gets focus. */
  #q{font-size:16px}
  #mapwrap{grid-row:1}
  #mobilebar{
    display:flex;gap:8px;position:absolute;top:0;left:0;right:0;z-index:500;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
    background:linear-gradient(var(--cream) 62%,rgba(253,246,232,0))
  }
  #mobilebar .mtitle{
    font-family:Caprasimo,Inter,sans-serif;font-weight:400;font-size:19px;color:var(--earth);
    align-self:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
  }
  #fabs{
    position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:500;
    display:flex;flex-direction:column;gap:9px
  }
  #fabs .iconbtn{width:48px;height:48px;border-radius:14px;font-size:20px;position:relative}
  #fabs .iconbtn .cnt{
    position:absolute;top:-6px;right:-6px;background:var(--earth);color:#fff;border:2px solid var(--ink);
    border-radius:999px;min-width:21px;height:21px;font-size:11px;font-weight:700;display:grid;place-items:center;
    font-family:Inter,sans-serif
  }
  #fabs .iconbtn .cnt[hidden]{display:none}
  /* Pinch-zoom is the phone gesture; the buttons only collide with the FABs. */
  .leaflet-control-zoom{display:none}
  .leaflet-control-attribution{margin-right:74px!important;font-size:9.5px}
  #detail{
    width:100%;height:auto;max-height:86%;top:auto;bottom:0;border-left:0;
    border-top:3px solid var(--ink);border-radius:16px 16px 0 0;
    transform:translateY(101%)
  }
  #detail.open{transform:none}
  .dhero{aspect-ratio:16/9}
  #mapnote{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 58px);left:12px;font-size:10.5px}
  .sheet{max-height:82%}
}
@media (min-width:861px){ #grabber{display:none} }
#grabber{width:42px;height:4px;border-radius:99px;background:var(--line);margin:7px auto 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app">
  <aside id="side" aria-label="Filters and search">
    <button class="dclose" id="sideclose" aria-label="Close filters">✕</button>
    <div id="grabber"></div>
    <div class="brand">
      <h1>Big Things<em>a map of Australia's giant roadside sculptures</em></h1>
      <p class="tag">Fibreglass fruit, enormous fauna and one 250-metre earthworm. Built from open data: every pin says how precisely it's placed.</p>
      <div class="counts" id="counts"></div>
      <p class="aboutlink"><a href="about.html">What is this, and how honest is it? →</a></p>
    </div>
    <div class="searchrow">
      <input id="q" type="search" placeholder="Search a prawn, a town, a ute…" autocomplete="off" aria-label="Search big things">
      <button class="iconbtn" id="listbtn" title="Show matching list" aria-label="Show matching list">☰</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="sidefoot">
      <button class="pillbtn hot" id="randombtn">🎲 Spin &amp; drive</button>
      <button class="pillbtn trip" id="tripbtn">🚗 Road trip <span id="tripcount"></span></button>
      <button class="pillbtn" id="statsbtn">📊 Superlatives</button>
      <button class="pillbtn" id="locatebtn">📍 Locate me</button>
      <button class="pillbtn" id="resetbtn">↺ Reset</button>
    </div>
    <p class="credits" id="credits"></p>
  </aside>

  <div id="mapwrap">
    <div id="map"></div>
    <div id="mobilebar">
      <span class="mtitle">Big Things</span>
      <button class="iconbtn" id="msearch" aria-label="Search and filter">🔍</button>
    </div>
    <div id="fabs">
      <button class="iconbtn" id="mtrip" aria-label="Road trip">🚗<span class="cnt" id="mtripcount" hidden>0</span></button>
      <button class="iconbtn" id="mrandom" aria-label="Random big thing">🎲</button>
      <button class="iconbtn" id="mlocate" aria-label="Locate me">📍</button>
      <button class="iconbtn" id="mfilter" aria-label="Filters">⚙️</button>
    </div>
    <div id="mapnote"></div>

    <section id="detail" aria-live="polite" aria-label="Big thing details">
      <button class="dclose" id="dclose" aria-label="Close details">✕</button>
      <div class="dscroll" id="dscroll"></div>
    </section>

    <section class="sheet" id="tripsheet" aria-label="Road trip">
      <div class="shead">
        <h3>🚗 Your road trip</h3>
        <button class="pillbtn" id="tripopt">Optimise</button>
        <button class="pillbtn" id="tripclear">Clear</button>
        <button class="iconbtn" data-close-sheet="tripsheet" aria-label="Close">✕</button>
      </div>
      <div class="sbody" id="tripbody"></div>
    </section>

    <section class="sheet" id="statsheet" aria-label="Superlatives">
      <div class="shead">
        <h3>📊 Superlatives</h3>
        <button class="iconbtn" data-close-sheet="statsheet" aria-label="Close">✕</button>
      </div>
      <div class="sbody" id="statbody"></div>
    </section>

    <section class="sheet" id="listsheet" aria-label="Matching big things">
      <div class="shead">
        <h3 id="listtitle">Matches</h3>
        <button class="iconbtn" data-close-sheet="listsheet" aria-label="Close">✕</button>
      </div>
      <div class="sbody" id="listbody"></div>
    </section>
  </div>
</div>

ive fine art, not roadside novelty advertising.","source":null},"addedManually":true},{"id":"3315407525","name":"The Big Potato","state":"NSW","stateName":"New South Wales","location":"Robertson","lat":-34.589209,"lng":150.598083,"precision":"exact-wikivoyage","coordSource":"https://en.wikivoyage.org/wiki/Australia%27s_big_things","builtYear":1977,"builtCirca":false,"builtRaw":"1977","era":"boom (1970s–early 80s)","sizeMaxM":10,"sizeKind":"dimensions","sizeRaw":"10 × 4 m","category":"fruit-and-veg","status":"standing","notes":"A giant potato constructed by farmer Jim Mauger in 1977. In 2025 it was transformed into 'The Pig Potato' to honour that the town is where Babe was filmed.","blurb":"Also known as the Big Turd, for reasons that are obvious as soon as you cast your eyes on it.","image":"Big Potato in Robertson, NSW.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"},{"source":"openstreetmap","page":"way/158622472","url":"https://www.openstreetmap.org/way/158622472"}]},{"id":"513e0feff3","name":"The Big Prawn","state":"NSW","stateName":"New South Wales","location":"Ballina","lat":-28.86378,"lng":153.53258,"precision":"exact-wikivoyage","coordSource":"https://en.wikivoyage.org/wiki/Australia%27s_big_things","builtYear":1989,"builtCirca":false,"builtRaw":"1989","era":"late century (1985–1999)","sizeMaxM":9,"sizeKind":"dimensions","sizeRaw":"6 × 9 m","category":"seafood","status":"standing","notes":"On 24 September 2009, Ballina Shire Council voted to allow the demolition of the Big Prawn; however, Bunnings purchased the site in 2011 and refurbished the Prawn as part of the redevelopment. The prawn now sits on a stand next to the entrance of the Bunnings Warehouse carpark.","blurb":"Another genuinely impressive Big Thing, rendered and painted in exquisite 3D detail. Al arwin-nt/"},"addedManually":true},{"id":"32a2f4b1aa","name":"The Anmatjere Man","state":"NT","stateName":"Northern Territory","location":"Aileron","town":"Aileron","lat":-22.64366,"lng":133.342797,"precision":"exact-osm","coordSource":"https://www.openstreetmap.org/node/1853027814","builtYear":2005,"builtCirca":false,"builtRaw":"2005","era":"revival (2000s–2014)","sizeKind":"unknown","category":"people-and-culture","status":"standing","notes":"Located approx. 150 km north of Alice Springs at the Aileron roadhouse/caravan park. It is believed to be modelled on Charlie Quartpot Ngwarray who was an important Anmatyerr leader and rainmaker for the area. The Anmatjere Man took a year to construct and was created in 2005 by Mark Egan. Until 2008 the Anmatjere Man a.k.a. The BIG Aboriginal Hunter stood alone on top of a hill which is accessible for pictures in dry conditions.","image":"Aileron-BigAboriginalManStatue.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"}],"correction":{"why":"The Location cell reads 'Anmatjere', a region rather than a settlement, which geocoded ~100 km north of the sculpture. The row's own notes place it at the Aileron Roadhouse on the Stuart Highway; OpenStreetMap maps the sculpture there.","source":"https://www.openstreetmap.org/node/1853027814"}},{"id":"67afb7ae54","name":"The Big Boxing Crocodile","state":"NT","stateName":"Northern Territory","location":"Humpty Doo","town":"Humpty Doo","lat":-12.575286,"lng":131.102106,"precision":"exact-verified","coordSource":"https://en.wikivoyage.org/wiki/Humpty_Doo","builtYear":1988,"builtCirca":false,"builtRaw":"1988","era":"late century (1985–1999)","sizeMaxM":8,"sizeKind":"dimensions","sizeRaw":"8 × 8 m","category":"fauna","status":"standing","notes":"Located outside the United Petroleum station (formerly known as the Bush Shop) on the Arnhem Highway at Humpty Doo. The Boxing Crocodile was built by Ray Park in 1988 on a commission by Ray Whear and Marshall Brentnall who was the owner of The Bush Shop at that time. It was created to celebrate Australia winning the America's Cup in 1983 and to assist with attracting tourism to the area. The Boxing Crocodile is Humpty Doo's equivalent to the Boxing Kangaroo.","image":"Big Crocodiles in Humpty Doo, Northern Territory, 2021.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"verified","page":"Wikivoyage — The Big Boxing Crocodile, 326 Arnhem Hwy (A36), Humpty Doo NT","url":"https://en.wikivoyage.org/wiki/Humpty_Doo"}],"coordMatch":{"kind":"researched","confidence":"high","why":"Address: 342 Arnhem Hwy, Humpty Doo NT 0836. Explicit GPS in Wikivoyage article. Located outside United Petroleum station (formerly Bush Shop) on Arnhem Highway.","osmName":"Wikivoyage — The Big Boxing Crocodile, 326 Arnhem Hwy (A36), Humpty Doo NT"}},{"id":"6fcf279acb","name":"The Big Dinosaur","state":"NT","stateName":"Northern Territory","location":"Yarrawonga","town":"Yarrawonga","lat":-12.4699,"lng":130.9908,"precision":"exact-verified","coordSource":"https://nominatim.openstreetmap.org/search?q=Pierssene+Road+Palmerston+NT&format=json&limit=3","builtCirca":false,"era":"unknown","heightM":13,"sizeMaxM":13,"sizeKind":"height","sizeRaw":"13 m","category":"fauna","status":"standing","notes":"This large fibreglass Brachiosaurus can be seen on Pierssene Rd, outside Bunnings Palmerston. It was previously a garden feature for 'Finlays Joint Cafe'. Originally bought by Tom Finlay, a stonemason, to complement a sculptured Dragon in Mr. Finlay's Landscaping supply section of his business. Mr. Finlay also purchased several other large dinosaurs made by the same Philippine-based Dutch company that produces models for adventure parks but began selling them in 2010.","image":"Big Dinosaur Darwin.png","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en lia.jpg","wikipediaArticle":"Map the Miner","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"}]},{"id":"65b7e37354","name":"Signalling Change","state":"SA","stateName":"South Australia","location":"Mount Gambier","town":"Mount Gambier","lat":-37.830897,"lng":140.770841,"precision":"exact-verified","coordSource":"https://landofthebigs.com/signalling-change-mount-gambier-sa/","builtCirca":false,"era":"unknown","sizeKind":"unknown","category":"oddity","status":"standing","sources":[{"source":"Land of the Bigs","page":"https://landofthebigs.com/signalling-change-mount-gambier-sa/","url":"https://landofthebigs.com/signalling-change-mount-gambier-sa/"}],"correction":{"why":"Catalogued by Land of the Bigs, which publishes a mapped position for it.","source":"https://landofthebigs.com/signalling-change-mount-gambier-sa/"},"addedManually":true},{"id":"fea416510c","name":"The Australian Farmer (also known as the Big Farmer)","state":"SA","stateName":"South Australia","location":"Wudinna","lat":-33.047014,"lng":135.460447,"precision":"exact-article","coordSource":"https://en.wikipedia.org/wiki/Australian_Farmer","builtYear":2008,"builtCirca":false,"builtRaw":"2008","era":"revival (2000s–2014)","heightM":8,"sizeMaxM":8,"sizeKind":"height","sizeRaw":"8 m","category":"people-and-culture","status":"standing","notes":"Taking 17 years to develop from the initial proposal to the final unveiling, the Australian Farmer, located in the Wudinna, was carved by artist Marijan Bekic and his son David between 2007 and 2009. Representing the early settlers of the region, the work stands at 8 m in height, and was carved out of approximately 70 t of local granite.","image":"Wikicon 2024 K3 Gn-134.jpg","wikipediaArticle":"Australian Farmer","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"}]},{"id":"a0af7869cf","name":"The Big Ant","state":"SA","stateName":"South Australia","location":"Poochera","town":"Poochera","lat":-32.7203,"lng":134.8386,"precision":"exact-verified","coordSource":"https://nominatim.openstreetmap.org/search?q=Poochera+SA&format=json","builtYear":2008,"builtCirca":false,"builtRaw":"2008","era":"revival (2000s–2014)","sizeKind":"unknown","category":"fauna","status":"relocated","statusEvidence":"Originally located at The Poochera Roadhouse on the Eyre Highway but the Roadhouse has closed and the Big Ant was relocated into the town park.","notes":"Originally located at The Poochera Roadhouse on the Eyre Highway but the Roadhouse has closed and the Big Ant was relocated into the town park.","image":"The Big Ant.JPG","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"},{"source":"verified","page":"Nominatim – Poochera, South Australia (notes: 'relocated into the town park')","url":"https://nominatim.openstreetmap.org/search?q=Poochera+SA&format=json"}],"coordMatch":{"kind":"researched","confidence":"medium","why":"Notes confirm ant was relocated from the closed Poochera Roadhouse into the town park. Poochera is a very small town; coordinate is town centre area on Eyre Highway SA. Specific park location within town not pinpointed.","osmName":"Nominatim – Poochera, South Australia (notes: 'relocated into the town park')"}},{"id":"21a50312b4","name":"The Big Apple","state":"SA","stateName":"South Australia","location":"Balhannah","town":"Balhannah","lat":-34.992667,"lng":138.818435,"precision":"exact-verified","coordSource":"https://landofthebigs.com/the-big-apple-balhannah-sa/","builtCirca":false,"era":"unknown","sizeKind":"unknown","category":"fruit-and-veg","status":"standing","sources":[{"source":"Land of the Bigs","page":"https://landofthebigs.com/the-big-apple-balhannah-sa/","url":"https://landofthe  Park","town":"Royal Park","lat":-34.872,"lng":138.508,"precision":"town","coordSource":"https://en.wikipedia.org/wiki/Royal_Park%2C_South_Australia","builtCirca":false,"era":"unknown","sizeKind":"unknown","category":"fauna","status":"standing","notes":"Located on top of the Hahndorf Gourmet Butchers","image":"Big Bull Royal Park.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"}]},{"id":"4075c50ebe","name":"The Big Cherries","state":"SA","stateName":"South Australia","location":"Pages Flat, near Adelaide","town":"Adelaide","lat":-34.9275,"lng":138.6,"precision":"town","coordSource":"https://en.wikipedia.org/wiki/Adelaide","builtCirca":false,"era":"unknown","sizeKind":"unknown","category":"fruit-and-veg","status":"standing","notes":"Located at Fleurieu Cherries on Pages Flat Road (B34) in Pages Flat","image":"Big Cherries Pages Flat.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"}]},{"id":"8d1bfab99b","name":"The Big Church Block Bottle","state":"SA","stateName":"South Australia","location":"McLaren Vale","town":"McLaren Vale","lat":-35.219773,"lng":138.541119,"precision":"town","coordSource":"https://en.wikipedia.org/wiki/McLaren_Vale%2C_South_Australia","builtYear":2010,"builtCirca":false,"builtRaw":"2010","era":"revival (2000s–2014)","heightM":10,"sizeMaxM":10,"sizeKind":"height","sizeRaw":"10 m","category":"food-and-drink","status":"removed","statusEvidence":"The Big Church Block Bottle is no longer on display at the Wirra Wirra Winery, having been removed in 2016.","notes":"The Big Church Block Bottle is no longer on display at the Wirra Wirra Winery, having been removed in 2016. The Big Church Block Bottle, named Our Work of Art, was a 10 m high replica bottle of Wirra Wirra, Church Block wine. The bottle was constructed to launch the Melbourne Food & Wine Festival in March 2010, located at Southbank in Melbourne. The bottle was located in Melbourne from 14 March 2010 through to 19 March 2010 before it was re-located to the Wirra Wirra vineyard in McLaren Vale, during April 2010. The bottle was designed in five sectional pieces, made from steel framework covered in wire mesh. The mesh has been cladded entirely by recycled corks. Each cork was individually drilled and threaded onto elastic before being cable tied around each section of the bottle.","image":"Big Cork Bottle.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"}]},{"id":"b786012fb9","name":"The Big Cockroach","state":"SA","stateName":"South Australia","location":"Port Wakefield Road, Lower Light","town":"Lower Light","lat":-34.5325,"lng":138.436944,"precision":"town","coordSource":"https://en.wikipedia.org/wiki/Lower_Light","builtCirca":false,"builtRaw":"1990s","era":"unknown","sizeMaxM":4,"sizeKind":"dimensions","sizeRaw":"4 × 4 m (approx.)","category":"fauna","status":"demolished","statusEvidence":"It was originally constructed in the 1990s, and was almost destroyed in 2013 but saved through public action and returned to the site.","notes":"The Big Cockroach is part of the Port Wakefield road sculptures, and features a sign verifying its global size dominance. Located on private land and next to a highway. It was originally constructed in the 1990s, and was almost destroyed in 2013 but saved through public action and returned to the site.","image":"Big Cockroach, South Australia.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"}]},{"id":"bf3546c963","name":"The Big Dice","state":"SA","stateName":"South Australia","location":"Barrier Highway","lat":-32.495127,"lng":139.787281,"precision":"exact-osm","coordSource":"https://www.openstreetmap.org/node/7208203539","builtCirca":false,"era":"unknown","sizeKind":"unknown","category":"oddity","status":"standing","notes":"The Big Dice consist of six concrete blocks piled into a small pyramid. They are located 24 km east of Yunta / 20 km west of Mannahill, just off the Barrier Highway at Cockscomb Creek","image":"Big Dice.JPG","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"openstreetmap","page":"node/7208203539","url":"https://www.openstreetmap.org/node/7208203539"}]},{"id":"bade5a3cd8","name":"The Big Dunlop Tyre","state":"SA","stateName":"South Australia","location":"Sturt Highway, Yamba","lat":-34.260038,"lng":140.861481,"precision":"exact-osm","coordSource":"https://www.openstreetmap.org/node/14055332985","builtCirca":false,"era":"unknown","sizeKind":"unknown","category":"machinery-and-transport","status":"standing","notes":"The Big Dunlop Tyre is in Yamba at the Quarantine Inspection Centre, about 4 km from the South Australia and Victoria Border on the Sturt Hwy, an hour and a quarter drive west of Mildura.","image":"Big Dunlop Tyre.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"openstreetmap","page":"node/14055332985","url":"https://www.openstreetmap.org/node/14055332985"}]},{"id":"876a9da8c5","name":"The Big Fish","state":"SA","stateName":"South Australia","location":"Yalata","town":"Yalata","lat":-31.384108,"lng":131.620547,"precision":"town","coordSource":"https://en.wikipedia.org/wiki/Yalata%2C_South_Australia","builtYear":2026,"builtCirca":false,"builtRaw":"2026","era":"modern (2015+)","sizeKind":"unknown","category":"seafood","status":"standing","notes":"Located at the Yalata Roadhouse, the 200-kilogram bronze mulloway sculpture was unveiled in 2026.","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"}]},{"id":"0e12f3f606","name":"The Big Galah","state":"SA","stateName":"South Australia","location":"Kimba","lat":-33.141548,"lng":136.42214,"precision":"exact-osm","coordSource":"https://www.openstreetmap.org/node/7092653230","builtYear":1993,"builtCirca":false,"builtRaw":"1993","era":"late century (1985–1999)","sizeMaxM":8,"sizeKind":"dimensions","sizeRaw":"8 × 2.5 m","category":"fauna","status":"standing","notes":"Residing at the \"Halfway Across Australia Tourist Shop\" at Kimba, the Big Galah was built from fibreglass over a steel frame by Robert Venning, and was opened in 1993. Modelled on the Galahs that frequent the region, it weighs in the vicinity of 2.3 t.","image":"Big Galah statue at Kimba, South Australia.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"},{"source":"openstreetmap","page":"node/7092653230","url":"https://www.openstreetmap.org/node/7092653230"}]},{"id":"e58c058a91","name":"The Big Hat","state":"SA","stateName":"South Australia","location":"Cradock","town":"Cradock","lat":-32.0697,"lng":138.4936,"precision":"exact-verified","coordSource":"https://nominatim.openstreetmap.org/search?q=Cradock+Hotel+SA+Australia&format=json","builtYear":2013,"builtCirca":false,"builtRaw":"2013","era":"revival (2000s–2014)","sizeKind":"unknown","category":"sport-and-leisure","status":"standing","notes":"Located opposite the Cradock Hotel.","image":"The Big Hat SA.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"verified","page":"Nominatim — Cradock Hotel, RM Williams Way, Cradock SA","url":"https://nominatim.openstreetmap.org/search?q=Cradock+Hotel+SA+Australia&format=json"}],"coordMatch":{"kind":"researched","confidence":"high","why":"Notes confirm 'located opposite the Cradock Hotel'. Nominatim found Cradock Hotel at -32.0697076, 138.4935888 — the sculpture is directly opposite.","osmName":"Nominatim — Cradock Hotel, RM Williams Way, Cradock SA"}},{"id":"e3dbadc85a","name":"The Big Hills Hoist","state":"SA","stateName":"South Australia","location":"O'Sullivan Beach","lat":-35.11779,"lng":138.48429,"precision":"exact-inline","coordSource":"https://en.wikipedia.org/wiki/Big_things_(Australia)","builtCirca":false,"era":"unknown","sizeKind":"unknown","category":"oddity","status":"standing","notes":"Located next to the Orrcon Steel carpark, at the corner of Morrow Rd and O'Sullivan Beach Rd, in O'Sullivan Beach.","image":"Big Hills Hoist, O'Sullivan Beach, South Australia.jpg","wikipediaArticle":"Hills Hoist","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"}]},{"id":"10b5e13340","name":"The Big Kangaroo","state":"SA","stateName":"South Australia","location":"Border Village","town":"Border Village","lat":-31.637838,"lng":129.004116,"precision":"exact-osm","coordSource":"https://www.openstreetmap.org/node/10232269618","builtYear":1986,"builtCirca":false,"builtRaw":"1986","era":"late century (1985–1999)","sizeMaxM":5,"sizeKind":"dimensions","sizeRaw":"5 × 2 m","category":"fauna","status":"standing","notes":"Also known as \"Rooey II\", the Big Kangaroo can be found at Border Village in South Australia, located just shy of the border with West Australia. Made from papier-mâché and fibreglass over a steel frame, from a design by Bill Metheral, Rooey was intended to capitalise on traffic journeying to Perth for the America's Cup, and was opened in 1986.","image":"Rooey II Border Village.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"},{"source":"openstreetmap","page":"node/10232269618","url":"https://www.openstreetmap.org/node/10232269618"}],"coordMatch":{"kind":"name-artwork","confidence":"medium","why":"single-token name matched on an OSM artwork 0.5 km away","osmName":"The Big Kangaroo - Rooey II"}},{"id":"0556100d53","name":"The Big Lobster","state":"SA","stateName":"South Australia","location":"Kingston SE","town":"Kingston SE","lat":-36.823778,"lng":139.863194,"precision":"exact-article","coordSource":"https://en.wikipedia.org/wiki/The_Big_Lobster","builtYear":1979,"builtCirca":false,"builtRaw":"1979","era":"boom (1970s–early 80s)","sizeMaxM":17,"sizeKind":"dimensions","sizeRaw":"17 × 15 × 13 m","category":"seafood","status":"standing","notes":"Known locally as \"Larry\", the Big Lobster was designed and built by Paul Kelly (who also designed the Big Scotsman) as a means of attracting attention to the visitor centre and restaurant at which it is located. It was built in six months out of a steel frame with a fibreglass shell. The size is incorrectly said to have been an error: the original plans were drawn in feet, but the designer misinterpreted them to be metres. The Specifications actually required the length to be ~12 metres long and it is a fraction longer than this.","image":"Kingston SE lobster.JPG","wikipediaArticle":"The Big Lobster","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"},{"source":"openstreetmap","page":"node/2128912065","url":"https://www.openstreetmap.org/node/2128912065"}],"correction":{"why":"Wikipedia's Location cell reads 'Rosetown'. Larry the Lobster stands at Kingston SE on the Princes Highway; the district council's own page for the sculpture gives that location. Build year (1979) and 17 m height are confirmed by the same source.","source":"https://www.kingstondc.sa.gov.au/discover/things-to-see-and-do/the-big-lobster"}},{"id":"9bd9d6079f","name":"The Big Olive","state":"SA","stateName":"South Australia","location":"Tailem Bend","town":"Tailem Bend","lat":-35.274727,"lng":139.469766,"precision":"exact-verified","coordSource":"https://www.openstreetmap.org/way/854133593","builtYear":2009,"builtCirca":false,"builtRaw":"2009","era":"revival (2000s–2014)","heightM":11,"sizeMaxM":11,"sizeKind":"height","sizeRaw":"11 m","category":"fruit-and-veg","status":"standing","notes":"The Big Olive was constructed to attract tourists to The Big Olive processing plant and visitor centre. Located just outside Tailem Bend, it consists of two olives – one green and one black – which together stand at 8 m and weigh over 1 t. The olives were constructed out of fibreglass by The Newell Group, and were placed on the site in April 2005.","image":"Big Olive.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"},{"source":"verified","page":"OpenStreetMap way 854133593 — Former Big Olive Site, 77 Big Olive Grove, Tailem Bend SA 5260","url":"https://www.openstreetmap.org/way/854133593"}],"coordMatch":{"kind":"researched","confidence":"high","why":"OSM labels this as 'Former Big Olive Site'. The Big Olive has been relocated from its original position; this is the recorded former site.","osmName":"OpenStreetMap way 854133593 — Former Big Olive Site, 77 Big Olive Grove, Tailem Bend SA 5260"}},{"id":"3dc0eb1331","name":"The Big Orange","state":"SA","stateName":"South Australia","location":"Berri","lat":-34.246389,"lng":140.620861,"precision":"exact-article","coordSource":"https://en.wikipedia.org/wiki/Big_Orange_(South_Australia)","builtYear":1980,"builtCirca":false,"builtRaw":"1980","era":"boom (1970s–early 80s)","sizeMaxM":15,"sizeKind":"dimensions","sizeRaw":"15 × 12 m","category":"fruit-and-veg","status":"standing","notes":"Located in the South Australian Riverland, the Big Orange was designed by Adelaide-based architect John Twopenny. It is constructed with fiberglass panels covering a steel frame, with the entire structure weighing in the vicinity of 85 t. The structure consists of four levels, with a function room on the first floor, a souvenir shop and cafe on the second, a mural depicting the local scenery on the third, and a lookout on the fourth. The Big Orange closed in 2004, but may still be photographed from the road, and in 2023 plans were approved to redevelop the site while retaining the Big Orange as the centrepiece or the new development.","image":"Big Orange.jpg","wikipediaArticle":"Big Orange (South Australia)","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"},{"source":"openstreetmap","page":"way/663121055","url":"https://www.openstreetmap.org/way/663121055"}]},{"id":"ccbae1a34d","name":"The Big Oyster","state":"SA","stateName":"South Australia","location":"Ceduna","town":"Ceduna","lat":-32.116667,"lng":133.666667,"precision":"town","coordSource":"https://en.wikipedia.org/wiki/Ceduna%2C_South_Australia","builtYear":1992,"builtCirca":false,"builtRaw":"1992","era":"late century (1985–1999)","sizeKind":"unknown","category":"seafood","status":"removed","statusEvidence":"Built by Leon Veerhuis out of ferro-concrete, it was retired from parade duties in 1994.","notes":"The Big Oyster was originally built as a float for Ceduna's annual Oysterfest. Built by Leon Veerhuis out of ferro-concrete, it was retired from parade duties in 1994. It is located next to an information booth on Eyre Highway just north of Ceduna.","image":"Big Oyster, Ceduna, South Australia.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"}]},{"id":"d90d03ef10","name":"The Big Pelican","state":"SA","stateName":"South Australia","location":"Loxton","lat":-34.448081,"lng":140.549896,"precision":"exact-osm","coordSource":"https://www.openstreetmap.org/node/4908752672","builtYear":1992,"builtCirca":false,"builtRaw":"1992","era":"late century (1985–1999)","sizeKind":"unknown","category":"fauna","status":"standing","notes":"The Big Pelican was originally constructed as a float for a local Mardi Gras in 1979. After being employed for this purpose on a number of occasions, including once in Adelaide, the papier-mâché structure was remodelled, and, in 1992, it was overlaid with fibreglass. Today it can be found at the Loxton Caravan Park.","image":"Big Pelican at Loxton.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"},{"source":"openstreetmap","page":"node/4908752672","url":"https://www.openstreetmap.org/node/4908752672"}]},{"id":"2931d89616","name":"The Big Pigeon","state":"SA","stateName":"South Australia","location":"Rundle Mall, Adelaide","town":"Rundle Mall","lat":-34.922987,"lng":138.601844,"precision":"exact-osm","coordSource":"https://www.openstreetmap.org/node/8956062045","builtYear":2020,"builtCirca":false,"builtRaw":"2020","era":"modern (2015+)","sizeKind":"unknown","category":"sculpture","status":"standing","notes":"The Big Pigeon is a mirrored stainless steel sculpture by South Australian artist Paul Sloan, installed in Rundle Mall Adelaide, on 6 November 2020. The pigeon is more than 2 metres tall, and cost $174,000.","image":"Big Pigeon.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"openstreetmap","page":"node/8956062045","url":"https://www.openstreetmap.org/node/8956062045"}],"correction":{"why":"A mirrored stainless-steel sculpture by South Australian artist Paul Sloan in Rundle Mall, per its own notes: commissioned public art, not roadside novelty advertising.","source":null},"coordMatch":{"kind":"name-exact","confidence":"high","why":"core name \"pigeon\" matches exactly, 0.0 km from the town point","osmName":"Pigeon"}},{"id":"3dcdb39bb2","name":"The Big Praying Mantids","state":"SA","stateName":"South Australia","location":"Mt Gambier","town":"Mt Gambier","lat":-37.833289,"lng":140.777595,"precision":"exact-verified","coordSource":"https://landofthebigs.com/the-big-praying-mantids-mt-gambier-sa/","builtCirca":false,"era":"unknown","sizeKind":"unknown","category":"fauna","status":"standing","sources":[{"source":"Land of the Bigs","page":"https://landofthebigs.com/the-big-praying-mantids-mt-gambier-sa/","url":"https://landofthebigs.com/the-big-praying-mantids-mt-gambier-sa/"}],"correction":{"why":"Catalogued by Land of the Bigs under big-insects, which publishes a mapped position for it.","source":"https://landofthebigs.com/the-big-praying-mantids-mt-gambier-sa/"},"addedManually":true},{"id":"0073e06bd4","name":"The Big Ram","state":"SA","stateName":"South Australia","location":"Karoonda","town":"Karoonda","lat":-35.0945,"lng":139.8964,"precision":"exact-verified","coordSource":"https://nominatim.openstreetmap.org/search?q=Railway+Karoonda+SA+Australia&format=json","builtYear":2003,"builtCirca":false,"builtRaw":"2003","era":"revival (2000s–2014)","sizeMaxM":3,"sizeKind":"dimensions","sizeRaw":"2 × 3 m","category":"fauna","status":"standing","notes":"The Big Ram in Karoonda recognises the importance of the sheep industry in the region. Instigated by the Karoonda Development Group and located on the Railway Lawns, the Big Ram is 2 m high and 3 m long, and is built from concrete. It was completed in 2003.","image":"Big Ram in Karoonda.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"},{"source":"verified","page":"Nominatim — Railway Terrace, Karoonda SA","url":"https://nominatim.openstreetmap.org/search?q=Railway+Karoonda+SA+Australia&format=json"}],"coordMatch":{"kind":"researched","confidence":"medium","why":"Notes confirm the Big Ram is on the 'Railway Lawns'. Nominatim found Railway Terrace, Karoonda at -35.0945472, 139.8963523, which corresponds to the railway precinct in the town.","osmName":"Nominatim — Railway Terrace, Karoonda SA"}},{"id":"50af16450b","name":"The Big Rocking Horse","state":"SA","stateName":"South Australia","location":"Gumeracha","lat":-34.820991,"lng":138.891842,"precision":"exact-article","coordSource":"https://en.wikipedia.org/wiki/Big_Rocking_Horse","builtYear":1981,"builtCirca":false,"builtRaw":"1981","era":"boom (1970s–early 80s)","sizeMaxM":18,"sizeKind":"dimensions","sizeRaw":"18 × 17 m","category":"fauna","status":"standing","notes":"Part of a complex that includes a wooden toy factory and a wildlife park, the Big Rocking Horse in the Adelaide Hills stands at over 18 metres tall and weighs more than 25 tonnes. Designed by David McIntosh and John Twopenny (the latter also designed The Big Orange), it took eight months to build at a cost of over $100,000. The steel structure incorporates three viewing platforms.","image":"Gumeracha giant rocking horse.jpg","wikipediaArticle":"Big Rocking Horse","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"},{"source":"openstreetmap","page":"way/180905016","url":"https://www.openstreetmap.org/way/180905016"}]},{"id":"dd574afcdd","name":"The Big Santa (Father Christmas)","state":"SA","stateName":"South Australia","location":"Adelaide","town":"Adelaide","lat":-34.929495,"lng":138.597822,"precision":"exact-verified","coordSource":"https://nominatim.openstreetmap.org/search?q=Adelaide+Central+Market+SA","builtCirca":false,"builtRaw":"1960s","era":"unknown","sizeMaxM":16.4,"sizeKind":"dimensions","sizeRaw":"16.4 × 5 × 2.5 m","category":"people-and-culture","status":"relocated","statusEvidence":"In 2015, the Big Santa was moved to Adelaide Central Market, after building changes in Rundle Mall removed the canopy he used to stand on.","notes":"Father Christmas (the Big Santa) was installed on the front of retailer John Martin's in the lead-up to Christmas, and later those premises became David Jones. In 2015, the Big Santa was moved to Adelaide Central Market, after building changes in Rundle Mall removed the canopy he used to stand on. Currently appears at Christmas on the Market's red brick Grote Street tower, built in 1900. Weighs almost three tonnes.","image":"Adelaides Big Santa on the Central Market tower.jpg","wikipediaArticle":"Father Christmas","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"},{"source":"verified","page":"OpenStreetMap — Adelaide Central Markets, Market Plaza Arcade, Adelaide SA 5000","url":"https://nominatim.openstreetmap.org/search?q=Adelaide+Central+Market+SA"}],"coordMatch":{"kind":"researched","confidence":"medium","why":"Giant Santa (16m, built 1960s) is mounted on the Market Tower on the Grote Street frontage of Adelaide Central Market. Only displayed seasonally at Christmas.","osmName":"OpenStreetMap — Adelaide Central Markets, Market Plaza Arcade, Adelaide SA 5000"}},{"id":"838a76fa84","name":"The Big Scotsman","state":"SA","stateName":"South Australia","location":"Medindie, Adelaide","lat":-34.893662,"lng":138.603647,"precision":"exact-osm","coordSource":"https://www.openstreetmap.org/node/12430047621","builtYear":1963,"builtCirca":false,"builtRaw":"1963","era":"pioneer (pre-1970)","sizeMaxM":5,"sizeKind":"dimensions","sizeRaw":"5 × 1 m","category":"people-and-culture","status":"standing","notes":"The Big Scotsman, affectionately known as 'Scotty', was erected in December 1963 and thus predated the Big Banana by a year. Located at Scotty's Motel on the corner of Main North Road and Nottage Terrace in the inner-city suburb of Medindie, the Big Scotsman was designed by Paul Kelly, who later went on to build the Big Lobster. Materials: Steel frame, polystyrene foam, fibreglass outer","image":"The Big Scotsman.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"},{"source":"openstreetmap","page":"node/12430047621","url":"https://www.openstreetmap.org/node/12430047621"}]},{"id":"270abd863b","name":"The Big Spriggina floundersi","state":"SA","stateName":"South Australia","location":"Arkaroola","lat":-30.315361,"lng":139.317056,"precision":"exact-inline","coordSource":"https://en.wikipedia.org/wiki/Big_things_(Australia)","builtCirca":false,"era":"unknown","sizeKind":"unknown","category":"oddity","status":"standing","notes":"Spriggina floundersi is a flatworm from the Ediacaran period, and is the fossil emblem of South Australia. Named after Reg Sprigg who both discovered the Ediacaran biota and also converted Arkaroola from an agricultural property into a wilderness sanctuary. A giant landscape model has been constructed in a valley on the property and is visible from the Mawson-Spriggina walking trail.","image":"Big Spriggina floundersi.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"}]},{"id":"946d51d2e7","name":"The Big Teddy Bear","state":"SA","stateName":"South Australia","location":"Minlaton","town":"Minlaton","lat":-34.772545,"lng":137.594126,"precision":"town","coordSource":"https://en.wikipedia.org/wiki/Minlaton","builtCirca":false,"era":"unknown","sizeMaxM":4,"sizeKind":"dimensions","sizeRaw":"4 × 3 m","category":"fauna","status":"standing","notes":"The Teddy Bear is constructed from round and square hay bales, and is located 7 kilometres north of Minlaton at 20006 Spencer Hwy, Koolywurtie.","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"}]},{"id":"17b5b0ad27","name":"The Big Winch","state":"SA","stateName":"South Australia","location":"Coober Pedy","lat":-29.008703,"lng":134.758022,"precision":"exact-osm","coordSource":"https://www.openstreetmap.org/node/1858643686","builtYear":1986,"builtCirca":false,"builtRaw":"1986","era":"late century (1985–1999)","sizeMaxM":8,"sizeKind":"dimensions","sizeRaw":"8 × 5 m","category":"machinery-and-transport","status":"demolished","statusEvidence":"Built by Klaus Wirries in the 1970s, the original Big Winch was destroyed in 1986 and rebuilt shortly thereafter.","notes":"The Big Winch acknowledges Coober Pedy's opal-mining industry. Built by Klaus Wirries in the 1970s, the original Big Winch was destroyed in 1986 and rebuilt shortly thereafter.","image":"Coober-Pedy2.jpg","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"},{"source":"openstreetmap","page":"node/1858643686","url":"https://www.openstreetmap.org/node/1858643686"}]},{"id":"5f1b90cd92","name":"The Big Windmill","state":"SA","stateName":"South Australia","location":"Penong","town":"Penong","lat":-31.929848,"lng":133.00955,"precision":"town","coordSource":"https://en.wikipedia.org/wiki/Penong","builtCirca":false,"era":"unknown","sizeKind":"unknown","category":"machinery-and-transport","status":"standing","notes":"The windmill museum includes the largest windmill in Australia.","image":"Windmill Penong - Gn251124.webm","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"}]},{"id":"cbcc30c0e4","name":"The Big Wombat","state":"SA","stateName":"South Australia","location":"Bookabie","town":"Bookabie","lat":-31.843288,"lng":132.675268,"precision":"town","coordSource":"https://en.wikipedia.org/wiki/Bookabie","builtCirca":false,"era":"unknown","sizeKind":"unknown","category":"fauna","status":"standing","notes":"Situated at Scotdesco Aboriginal Community (Tjilkaba), on the Eyre Highway.","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"}]},{"id":"b6ce1a5bf1","name":"The Big Yabby","state":"SA","stateName":"South Australia","location":"Clayton","town":"Clayton","lat":-35.495488,"lng":138.911048,"precision":"town","coordSource":"https://en.wikipedia.org/wiki/Clayton%2C_South_Australia","builtYear":1973,"builtCirca":false,"builtRaw":"1973","era":"boom (1970s–early 80s)","heightM":2,"sizeMaxM":2,"sizeKind":"height","sizeRaw":"2 m","category":"seafood","status":"removed","statusEvidence":"As of 2015, the Yabby is no longer there.","notes":"Built in 1973 by Henry Jones, the Big Yabby resides at the Murray River town of Clayton, and originally sat outside his family's Yabby City Restaurant. While the concrete yabby remains, the restaurant has since changed both owners and name to become Sails at Clayton, and yabbies are no longer on the menu. As of 2015, the Yabby is no longer there. The Big Yabby now resides next to a private house in Clayton Bay and can be seen from the street in 2020.","sources":[{"source":"wikipedia","page":"Big things (Australia)","url":"https://en.wikipedia.org/wiki/Big_things_(Australia)"},{"source":"wikivoyage","page":"Australia's big things","url":"https://en.wikivoyage.org/wiki/Australia%27s_big_things"}]},{"id":"16e60ed568","name":"The Loch-Eel Monster","state":"SA","stateName":"South Australia","location":"Lochiel","town":"Lochiel","lat":-33.927483,"lng":138.160681,"precision":"exact-verified","coordSource":"https://landofthebigs.com/the-loch-eel-monster-lochiel-sa/","builtCirca":false,"era":"unknown","sizeKind":"unknown","category":"seafood","status":"standing","sources":[{"source":"Land of the Bigs","page":"https://landofthebigs.com/the-loch-eel-monster-lochiel-sa/","url":"https://landofthebigs.com/the-loch-eel-monster-lochiel-sa/"}],"correction":{"why":"Catalogued by Land of the Bigs under big-sea-creatures, which publishes a mapped position for it.","source":"https://landofthebigs.com/the-loch-eel-monster-lochiel-sa/"},"addedManually":true},{"id":"3d93f70750","name":"The Protest Statues","state":"SA","stateName":"South Australia","location":"Lower Light","town":"Lower Light","lat":-34.502173,"lng":138.322389,"precision":"exact-verified","coordSource":"https://landofthebigs.com/the-protest-statues-lower-light-sa/","builtCirca":false,"era":"unknown","sizeKind":"unknown","category":"fauna","status":"standing","sources":[{"source":"Land of the Bigs","page":"https://landofthebigs.com/the-protest-statues-lower-light-sa/","url":"https://landofthebigs.com/the-protest-statues-lower-light-sa/"}],"correction":{"why":"Catalogued by Land of the Bigs under big-animals, big-insects, big-people, which publishes a mapped position for it.","source":"https://landofthebigs.com/the-protest-statues-lower-light-sa/"},"addedManually":true},{"id":"1e8630c4c4","name":"Big Apple","state":"TAS","stateName":"Tasmania","location":"Spreyton","town":"Spreyton","lat":-41.216667
